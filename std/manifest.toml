# ── std::process ──────────────────────────────────────────────────────────────
# The legacy `std::process` free functions were retired in the 2026-10-29
# host/core wave (#917, ADR-092). The module is a compatibility facade that
# re-exports `std::host::process::Process`; a qualified old free call fails with
# an E0100 hint from resolver::removed_names.

# ── std::env ─────────────────────────────────────────────────────────────────
# The legacy `std::env` module path was retired in the 2026-10-28 env wave
# (#917). `std::host::env::Env` is the only env surface; a qualified old call
# fails with an E0100 hint from resolver::removed_names.

# ── std::cli ─────────────────────────────────────────────────────────────────
# The `std::cli` free functions were retired in the 2026-10-29 host/core wave
# (#917, ADR-092). Argument-vector reads live on `Env`; the explicit-vector
# scanners live on `Cli`.

[[types]]
name = "Cli"
module = "std::cli"
stability = "provisional"
prelude = false
kind = "struct"
doc = "Namespace for command-line parsing over an explicit Vec<String>: Cli::flag(args, name) and Cli::option(args, name). Process-argument reads live on std::host::env::Env (Env::args / arg_count / arg_at / has_flag). The stable free functions were deleted in the #917 host/core wave."
methods = ["flag", "option"]

# ── std::json / std::toml value types ────────────────────────────────────────
#
# The document entry points retired by #917 (ADR-046) are associated functions
# on the value types: `JsonValue::parse` / `JsonValue::to_text` and
# `TomlValue::parse` / `TomlValue::to_text`. The 2026-10-27 wave also retired
# the JSON/TOML parse-step helper frees onto `JsonParseStep`, `TomlValStep`,
# and `TomlKeyStep`. All removed entries were experimental (ADR-014 D4), so no
# W0009 window applies; qualified calls get E0100 hints from
# `resolver::removed_names::removed_{json,toml}_member_hint`.


# The 27 ordered `experimental` free functions (btree_*, btree_set_*,
# index_map_*, index_set_*, and the extended bitset set/clear/with_capacity/
# count/union/intersection) were retired by #917 in the ordered-group wave
# (ADR-014 D4, no deprecation window). The replacement is the BTreeMap /
# BTreeSet / IndexMap / IndexSet / BitSet receiver methods; qualified old
# calls fail with E0100 hints from
# resolver::removed_names::removed_ordered_member_hint.

# ─────────────────────────────────────────────
# std::collections::compiler — Arena, SlotMap, Interner
# ─────────────────────────────────────────────
#
# The 14 free functions were retired by #917 (wave/associated-remain) in the
# ADR-014 experimental window. The public surface is the type constructors and
# receiver methods; the old `arena_*` / `slotmap_*` / `interner_*` names fail
# resolution with E0100 hints.

[[modules]]
name = "std::collections::compiler"
stability = "experimental"
family = "collections"
doc = "Experimental compiler-oriented collections: Arena (bump allocator), SlotMap (deletion-safe handle map), and Interner (value-to-symbol map). The public surface is the Arena / SlotMap / Interner type methods; the former free functions were retired by #917 with E0100 hints."
availability = { t1 = true, t3 = true }

[[types]]
name = "Arena"
module = "std::collections::compiler"
stability = "experimental"
kind = "struct"
doc = "Bump allocator that hands out stable i32 arena ids; the backing entry vector is private."
methods = ["new", "alloc", "get", "len"]

[[types]]
name = "SlotMap"
module = "std::collections::compiler"
stability = "experimental"
kind = "struct"
doc = "Deletion-safe handle map for i32 values; keys stay stable across removes and removed slots report None."
methods = ["new", "insert", "get", "remove", "contains", "len"]

[[types]]
name = "Interner"
module = "std::collections::compiler"
stability = "experimental"
kind = "struct"
doc = "Value-to-symbol bidirectional map for String values; interning deduplicates and returns a stable i32 symbol."
methods = ["new", "intern", "lookup", "len"]


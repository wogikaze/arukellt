# === std::wit ===
#
# The 16 experimental `wit_type_*` entries were retired by the #917 WIT wave.
# Their replacements are the `WitType` method / associated surface in
# `std/wit/types.ark` (`WitType::Bool` … `WitType::String` variants,
# `WitType::list` / `WitType::option`, `id` / `name` / `wit_text`,
# `WitType::from_id` / `WitType::name_from_ark`). Experimental entries may be
# deleted directly under ADR-014 D4; no deprecation window applies.

# === std::component ===
#
# The 7 experimental `std::component` / `std::component::handle` function
# entries were retired by the #917 component wave. Their replacements are
# associated functions on `Component` and receiver methods on
# `HandleTableI32` (ADR-044/ADR-046); experimental entries may be deleted
# directly under ADR-014 D4, so no deprecation window applies. The 7
# `std::component::canonical` frees were retired the same way onto the
# `Component` canonical ABI associated functions.

[[types]]

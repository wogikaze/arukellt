name = "std::collections::hash"
stability = "stable"
family = "collections"
doc = "HashMap<i32,i32> and HashSet<i32> monomorphic surface (i32-keyed, i32-valued). `hashmap_get_option` is the primary lookup API because it distinguishes missing keys from stored zero values. `hashmap_set` returns bool so fixed-capacity insertion failure is explicit. The i32 hash policy matches std::core::hash::hash_i32. Raw bucket layout remains documented for compatibility but is not the recommended user path."


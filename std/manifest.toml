# === std::io ===
#
# ADR-085 Phases A-F: target-independent Read / Write / BufRead / Seek traits,
# SeekFrom, the memory Reader / Writer newtypes, the Io algorithms, and the
# generic adapters. Only the tagged output write pair stays callable, because
# stdout() / stderr() are not typed Write handles yet (ADR-085 D9).

[[modules]]
name = "std::io"
stability = "stable"
family = "core"
doc = "Target-independent I/O abstraction (ADR-085): public Read / Write / BufRead / Seek traits, SeekFrom, memory Reader / Writer newtypes, the Io generic algorithms, and the generic BufReader<R> / BufWriter<W> adapters. The legacy free functions are retired (E0100) except writer_write / writer_write_str, which stay deprecated until std::host::stdio exposes typed Write handles for stdout() / stderr()."
availability = { t1 = true, t3 = true }

[[types]]
name = "IoError"
module = "std::io"
stability = "stable"
prelude = false
kind = "enum"
doc = "Typed I/O error with UnexpectedEof and Other variants; implements Display and Error."
trait_impls = ["Display", "Error"]

[[types]]
name = "SeekFrom"
module = "std::io"
stability = "experimental"
prelude = false
kind = "enum"
doc = "Offset origin for Seek: Start(i64), Current(i64), or End(i64)."
methods = []

[[types]]
name = "Read"
module = "std::io"
stability = "experimental"
prelude = false
kind = "trait"
doc = "Pull-based byte source. read(max_bytes) returns the bytes read; an empty Vec is EOF."
methods = ["read"]

[[types]]
name = "Write"
module = "std::io"
stability = "experimental"
prelude = false
kind = "trait"
doc = "Byte sink. write(data) returns the accepted count; flush commits the sink boundary."
methods = ["write", "flush"]

[[types]]
name = "BufRead"
module = "std::io"
stability = "experimental"
prelude = false
kind = "trait"
doc = "Buffered byte source over Read with fill_buf / consume / read_line; read_line returns None at EOF."
methods = ["fill_buf", "consume", "read_line"]
trait_impls = ["Read"]

[[types]]
name = "Seek"
module = "std::io"
stability = "experimental"
prelude = false
kind = "trait"
doc = "Random access over a byte stream; seek takes SeekFrom and position reports the cursor."
methods = ["seek", "position"]

[[types]]
name = "Reader"
module = "std::io"
stability = "experimental"
prelude = false
kind = "struct"
doc = "In-memory read handle over an owned byte image; implements Read, BufRead, and Seek."
methods = ["from_bytes", "new", "len", "is_eof", "into_bytes"]
trait_impls = ["Read", "BufRead", "Seek"]

[[types]]
name = "Writer"
module = "std::io"
stability = "experimental"
prelude = false
kind = "struct"
doc = "In-memory write handle over an owned byte image; implements Write."
methods = ["new", "into_bytes", "into_reader", "write_string"]
trait_impls = ["Write"]

[[types]]
name = "Io"
module = "std::io"
stability = "experimental"
prelude = false
kind = "struct"
doc = "Namespace type for receiver-less generic algorithms over the I/O traits: copy, read_exact, read_to_end, read_to_string, and write_all."
methods = ["copy", "read_exact", "read_to_end", "read_to_string", "write_all"]

[[types]]
name = "BufReader"
module = "std::io"
stability = "experimental"
prelude = false
kind = "struct"
generic_params = ["R"]
doc = "Buffered byte source over a Read handle; implements Read and BufRead, and Seek when the inner handle is Seek."
methods = ["new"]
trait_impls = ["Read", "BufRead", "Seek"]

[[types]]
name = "BufWriter"
module = "std::io"
stability = "experimental"
prelude = false
kind = "struct"
generic_params = ["W"]
doc = "Buffered byte sink over a Write handle; flushes at capacity and on flush/into_inner."
methods = ["new", "write_string", "into_inner"]
trait_impls = ["Write"]


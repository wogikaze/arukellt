# Arukellt Standard Library Manifest
# Current owner for public stdlib paths, documentation, stability, deprecation,
# and the published prelude surface. Compiler semantic registrations remain in
# resolver/typechecker/MIR/emitter code until proposed ADR-042 is accepted and
# issue #798 performs an explicit ownership migration.
#
# Sources cross-referenced:
#   - src/compiler/resolver.ark           (prelude symbols)
#   - src/compiler/typechecker.ark        (builtin signatures)
#   - std/prelude.ark                     (wrapper functions)
#   - src/compiler/emitter.ark            (selfhost emitter dispatch)
#
# Discrepancies found during initial audit (documented, not fixed):
#   - __intrinsic_string_is_empty: resolver prelude entry exists without a builtin signature.
#   - Several resolver prelude builtins lack direct typechecker signatures:
#       unwrap_or_else, clear, is_ok, is_err, Vec_with_capacity_i32,
#       Vec_with_capacity_String, as_slice, ok_or, ok, err, expect,
#       map_option_String_String, map_result_i32_i32
#     These are resolved dynamically or via special-case handling in the type checker.

[metadata]
version = "0.1.0"

[deprecation_policy]
# Defaults apply to legacy deprecated entries that predate per-entry lifecycle
# metadata. New deprecations should override deprecated_since/remove_in when
# their window differs.
default_since = "0.1.0"
default_remove_in = "1.0.0"
minimum_complete_releases = 1

[prelude_policy]
# The v2 contract is intentionally smaller than the legacy auto-import set.
# `legacy_auto_import` was removed by #878: only the stable set below is
# auto-imported; all other prelude decls require `use std::prelude::{name}`.
language_version = "v2"
legacy_auto_import = false
stable_types = ["Option", "Result", "String", "Vec"]
stable_values = ["Some", "None", "Ok", "Err"]
lexical_literals = ["true", "false"]
stable_functions = [
    "panic",
    "assert",
    "String_from",
    "String_new",
    "char_to_string",
]
intrinsic_compatibility_functions = [
    "len",
    "push",
    "pop",
    "get",
    "set",
    "get_unchecked",
]

# ─────────────────────────────────────────────
# Prelude types (auto-imported)
# ─────────────────────────────────────────────

[[types]]
name = "Option"
kind = "enum"
doc = "Optional value: either `Some(T)` or `None`."
prelude = true
stability = "stable"
generic_params = ["T"]

[[types]]
name = "Result"
kind = "enum"
doc = "Operation result: either `Ok(T)` or `Err(E)`."
prelude = true
stability = "stable"
generic_params = ["T", "E"]

[[types]]
name = "String"
kind = "struct"
doc = "UTF-8 string value."
prelude = true
stability = "stable"
type_id = "string"

[[types]]
name = "Vec"
kind = "struct"
doc = "Growable contiguous sequence."
prelude = true
generic_params = ["T"]
type_id = "vec"
methods = [
    "new",

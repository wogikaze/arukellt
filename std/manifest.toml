# === std::wasm v128 memory frees (lowering-blocked) ===
#
# These stay free functions: an associated/method form lowers the
# `__wasm_v128_*` intrinsic to an unresolved trap stub on both targets. The
# top-level decl still emits `v128.load` / `v128.store`.

[[functions]]
name = "v128_load"
module = "std::wasm"
doc_category = "wasm"
stability = "experimental"
core_op_id = "wasm.v128.load"
params = ["i32", "i32"]
returns = "v128"
doc = "Load a v128 from linear memory at ptr + offset."

[[functions]]
name = "v128_store"
module = "std::wasm"
doc_category = "wasm"
stability = "experimental"
params = ["i32", "i32", "v128"]
returns = "()"
doc = "Store a v128 to linear memory at ptr + offset."

[[functions]]

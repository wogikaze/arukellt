[[types]]
name = "HashMap"
kind = "struct"
doc = "Hash-based key/value map. `new`, `insert`, `get`, `contains_key`, `remove`, `len`, `is_empty`, `keys`, `values`, and `entries` are generic over the supported pairs. The capacity / bulk-maintenance surface (`with_capacity`, `capacity`, `reserve`, `try_reserve`, `shrink_to_fit`, `clear`, `drain`, `remove_entry`, `extend`) is implemented for `HashMap<i32, i32>` only; the other pairs reject it with E0200 instead of lowering over the wrong store layout."
prelude = true
stability = "provisional"
generic_params = ["K", "V"]
type_id = "hashmap"
methods = [
    "new",
    "insert",
    "get",
    "contains_key",
    "remove",
    "len",
    "is_empty",
    "keys",
    "values",
    "entries",
    "with_capacity",
    "capacity",
    "reserve",
    "try_reserve",
    "shrink_to_fit",
    "clear",
    "drain",
    "remove_entry",
    "extend",
]


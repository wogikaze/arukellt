# ── std::core::iter (v2 lazy iteration, ADR-076) ─────────────────────────────

[[modules]]
name = "std::core::iter"
stability = "provisional"
family = "core"
doc = "Lazy pull-based iteration protocol. Iterator is the item-polymorphic producer contract (next/collect/count); IntoIterator and FromIterator own source/destination conversion; IteratorSum and IteratorFold carry numeric aggregation as capability traits so non-numeric items need no invented numeric meaning (ADR-076). Concrete lanes: Vec<i32>, Vec<String>, Range, RangeInclusive."
availability = { t1 = true, t3 = true }


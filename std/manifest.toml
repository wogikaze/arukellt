# === std::io ===
#
# ADR-085 Phases A-F: target-independent Read / Write / BufRead / Seek traits,
# SeekFrom, the memory Reader / Writer newtypes, the Io algorithms, the generic
# adapters, and the host File trait impls. Only the tagged output write pair
# stays callable, because stdout() / stderr() are not typed Write handles yet
# (ADR-085 D9).


name: PR43 bootstrap overlay diagnostics

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  overlay:
    if: github.head_ref == 'fix/wasm-gc-type-plan-owner-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wasm-gc-type-plan-owner-phase1
          fetch-depth: 0
      - name: Generate and inspect flat bootstrap overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          import sys

          root = Path.cwd()
          path = root / 'scripts' / 'selfhost' / 'checks.py'
          spec = importlib.util.spec_from_file_location('selfhost_checks', path)
          assert spec and spec.loader
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)
          overlay = mod._prepare_flattened_selfhost_source(root)
          print(f'overlay={overlay}')

          inspect = [
              'src/compiler/main.ark',
              'src/compiler/component_emit_tier3_roundtrip.ark',
              'src/compiler/component_emit_resource.ark',
              'src/compiler/component_emit_flags.ark',
              'src/compiler/component_export_shapes_resource_scan.ark',
              'src/compiler/component_types_wit_compound.ark',
          ]
          for rel in inspect:
              f = overlay / rel
              print(f'=== {rel} exists={f.exists()} ===')
              if f.exists():
                  text = f.read_text(errors='replace')
                  print(text if rel != 'src/compiler/main.ark' else '\n'.join(text.splitlines()[:240]))

          compiler_root = overlay / 'src' / 'compiler'
          entries = []
          for f in sorted(compiler_root.glob('*.ark')):
              entries.append((f.name, f.read_text(errors='replace')))
          reachable = mod._overlay_reachable_rels(entries)
          rels = [
              'component_emit_tier3_roundtrip.ark',
              'component_emit_resource.ark',
              'component_emit_flags.ark',
              'component_export_shapes_resource_scan.ark',
              'component_types_wit_compound.ark',
              'component_type_section_entries.ark',
              'component_export_sections_entries.ark',
          ]
          for rel in rels:
              print(f'reachable {rel}={rel in reachable}')
          keepers, renames = mod._compute_overlay_symbol_plan(entries)
          for symbol in [
              'try_emit_tier3_roundtrip_component',
              'try_emit_resource_roundtrip_component',
              'try_emit_flags_roundtrip_component',
              'comp_single_resource_roundtrip_export_name',
              'comp_wit_resource_type',
              'comp_wit_own_type',
          ]:
              print(f'--- symbol {symbol} ---')
              print('keepers=', sorted(x for x in keepers if x[1] == symbol))
              print('renames=', sorted(x for x in renames if x[1] == symbol))

          for rel in ['std/wit/names.ark', 'std/wit/scan.ark', 'std/prelude.ark']:
              f = overlay / rel
              print(f'overlay_file {rel} exists={f.exists()}')
          PY
      - name: Regenerate docs for exact CI diff
        run: |
          python3 scripts/gen/generate-docs.py
          mkdir -p .build/pr43-generated-docs/files
          git diff --name-only -- README.md docs > .build/pr43-generated-docs/changed.txt
          git diff -- README.md docs > .build/pr43-generated-docs/generated.patch
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p ".build/pr43-generated-docs/files/$(dirname "$f")"
            cp "$f" ".build/pr43-generated-docs/files/$f"
          done < .build/pr43-generated-docs/changed.txt
          cat .build/pr43-generated-docs/changed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr43-generated-docs
          path: .build/pr43-generated-docs/
          if-no-files-found: error

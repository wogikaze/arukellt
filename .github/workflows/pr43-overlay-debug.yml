name: PR43 bootstrap overlay diagnostics

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  overlay:
    if: github.head_ref == 'fix/wasm-gc-type-plan-owner-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wasm-gc-type-plan-owner-phase1
          fetch-depth: 0
      - name: Generate and inspect flat bootstrap overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          import sys

          root = Path.cwd()
          path = root / 'scripts' / 'selfhost' / 'checks.py'
          spec = importlib.util.spec_from_file_location('selfhost_checks', path)
          assert spec and spec.loader
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)
          overlay = mod._prepare_flattened_selfhost_source(root)
          print(f'overlay={overlay}')

          inspect = [
              'src/compiler/component_emit_tier3_roundtrip.ark',
              'src/compiler/component_emit_resource.ark',
              'src/compiler/component_emit_flags.ark',
          ]
          for rel in inspect:
              f = overlay / rel
              print(f'=== {rel} exists={f.exists()} ===')
              if f.exists():
                  print(f.read_text(errors='replace'))

          compiler_root = overlay / 'src' / 'compiler'
          entries = []
          for f in sorted(compiler_root.glob('*.ark')):
              entries.append((f.name, f.read_text(errors='replace')))
          reachable = mod._overlay_reachable_rels(entries)
          for rel in ['component_emit_tier3_roundtrip.ark', 'component_emit_resource.ark', 'component_emit_flags.ark']:
              print(f'reachable {rel}={rel in reachable}')
          keepers, renames = mod._compute_overlay_symbol_plan(entries)
          for symbol in [
              'try_emit_tier3_roundtrip_component',
              'try_emit_resource_roundtrip_component',
              'try_emit_flags_roundtrip_component',
          ]:
              print(f'--- symbol {symbol} ---')
              print('keepers=', sorted(x for x in keepers if x[1] == symbol))
              print('renames=', sorted(x for x in renames if x[1] == symbol))

          for rel in ['std/wit/names.ark', 'std/wit/scan.ark', 'std/prelude.ark']:
              f = overlay / rel
              print(f'overlay_file {rel} exists={f.exists()}')
          PY

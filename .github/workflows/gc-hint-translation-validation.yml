name: GC hint translation validation

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates, master]
  workflow_dispatch:

concurrency:
  group: gc-hint-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gc-hint-translation-validation:
    name: "GC hint translation validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check fail-closed source contract
        run: python3 scripts/check/check-gc-hint-translation-validation.py

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build host-linker
        run: |
          cargo build --release --quiet
          cargo test --lib --no-run --quiet
        working-directory: tools/host-linker

      - name: Build and validate selfhost stages
        run: |
          set +e
          python3 scripts/manager.py selfhost fixpoint --build
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo 'selfhost stage build or validation failed'
            exit 1
          fi
          test -s .build/selfhost/arukellt-s2.wasm
          test -s .build/selfhost/arukellt-s3.wasm
          if [ "$rc" -eq 1 ]; then
            echo 's2/s3 byte fixpoint deferred: pinned bootstrap stubs mir_opt'
          fi

      # s3 contains the current mir_opt implementation. The fixture needs more
      # than the module's default 512 MiB heap, but does not need Memory64.
      # Rewrite only the memory section so GC types and instructions remain
      # byte-for-byte unchanged.
      - name: Raise current s3 memory32 initial size
        run: |
          python3 scripts/bootstrap/set-wasm-memory32-initial.py \
            .build/selfhost/arukellt-s3.wasm \
            .build/selfhost/arukellt-s3-runtime.wasm \
            --pages 65535
          test -s .build/selfhost/arukellt-s3-runtime.wasm
          wasmtime compile \
            --wasm gc \
            --wasm function-references \
            -W max-memory-size=4294967296 \
            .build/selfhost/arukellt-s3-runtime.wasm \
            -o .build/selfhost/arukellt-s3-runtime.cwasm

      - name: Exercise gc hint at opt-level 2
        env:
          ARUKELLT_SELFHOST_WASM: .build/selfhost/arukellt-s3-runtime.wasm
        run: python3 scripts/check/check-gc-hint-runtime.py

      - name: Upload translation receipt
        uses: actions/upload-artifact@v4
        with:
          name: gc-hint-translation-receipt
          path: .build/proof/gc-hint-translation-receipt.json
          if-no-files-found: error

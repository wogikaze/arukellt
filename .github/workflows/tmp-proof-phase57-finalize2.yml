name: Temporary proof phase57 finalizer v2

on:
  push:
    branches: [agent/proof-phase-5-7]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proof-phase-5-7
          fetch-depth: 0
      - name: Apply final wiring
        run: python3 scripts/dev/finalize-proof-phase57.py
      - name: Validate local wiring
        run: |
          python3 -m unittest scripts.tests.test_boundary_registry
          python3 -m compileall -q scripts
          grep -q 'prepare-proof-release-toolchain-v7.py' scripts/run/proof-required-release.sh
          grep -q 'proof-phase7-boundary.json' .github/workflows/proof-required-release.yml
      - name: Commit final wiring
        run: |
          if git diff --quiet; then
            echo "phase57 finalizer: no changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release/boundary-registry.json scripts/proof/boundary_registry.py scripts/tests/test_boundary_registry.py scripts/run/proof-required-release.sh .github/workflows/proof-required-release.yml
          git commit -m "proof(p7): enforce phase57 release trust boundaries"
          git push origin HEAD:agent/proof-phase-5-7

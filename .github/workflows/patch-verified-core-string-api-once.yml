name: Patch VerifiedCore String API once

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/typed-verified-core-emitter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typed-verified-core-emitter
          fetch-depth: 0

      - name: Remove custom render result boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer_path = Path('src/compiler/driver/verified_core_render.ark')
          text = renderer_path.read_text()
          struct_start = text.index('struct VerifiedCoreRenderResult {')
          helpers_end = text.index('fn vc_string_has_question(', struct_start)
          text = text[:struct_start] + text[helpers_end:]

          text = text.replace(
              'fn render_verified_core(program: CoreHirRawProgram, config: DriverConfig) -> VerifiedCoreRenderResult {',
              'fn render_verified_core(program: CoreHirRawProgram, config: DriverConfig) -> String {',
              1,
          )
          text = text.replace(
              '        return VerifiedCoreRenderResult_err("VerifiedCore missing module boundary")',
              '        return ""',
              1,
          )
          text = text.replace(
              '''                return VerifiedCoreRenderResult_err(
                              concat("VerifiedCore failed to render function index ", to_string(fi))
                          )''',
              '                return ""',
              1,
          )
          text = text.replace(
              '    VerifiedCoreRenderResult_ok(out)\n}',
              '    return out\n}',
              1,
          )
          if 'VerifiedCoreRenderResult' in text:
              raise SystemExit('custom VerifiedCore result references remain')
          renderer_path.write_text(text)

          pipeline_path = Path('src/compiler/driver/pipeline_backend.ark')
          pipeline = pipeline_path.read_text()
          old = '''        if !verified_core_render::verified_core_render_result_ok(rendered) {
                      return result_record::CompileResult_err(
                          4,
                          verified_core_render::verified_core_render_result_error(rendered)
                      )
                  }
                  stdio::println(verified_core_render::verified_core_render_result_output(rendered))'''
          new = '''        if len(clone(rendered)) == 0 {
                      return result_record::CompileResult_err(4, "VerifiedCore rendering failed")
                  }
                  stdio::println(rendered)'''
          if old not in pipeline:
              raise SystemExit('pipeline render result block missing')
          pipeline_path.write_text(pipeline.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/driver/verified_core_render.ark src/compiler/driver/pipeline_backend.ark
          git commit -m 'fix(proof): use String VerifiedCore render boundary'
          git push origin HEAD:agent/typed-verified-core-emitter

name: PR43 self patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/wasm-gc-type-plan-owner-phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wasm-gc-type-plan-owner-phase1
          fetch-depth: 0
      - name: Apply selfhost bootstrap fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/selfhost/checks.py')
          text = path.read_text(encoding='utf-8')

          old_alias = '''                if explicit_alias is not None:
                    output.append(f"{match.group(1)}use {flat} as {explicit_alias}")
                else:
                    output.append(f"{match.group(1)}use {flat}")'''
          new_alias = '''                # Qualified alias references were canonicalized to the flat
                # module name above.  Keep the dependency import alias-free so
                # the pinned bootstrap loader sees the actual flat module.
                output.append(f"{match.group(1)}use {flat}")'''
          if old_alias not in text:
              raise SystemExit('expected _flatten_compiler_imports alias block not found')
          text = text.replace(old_alias, new_alias, 1)

          start = text.index('def _rebuild_current_s2_locked(')
          end = text.index('\ndef _ensure_current_selfhost(', start)
          chunk = text[start:end]
          old_runtime = 'runtime = _parity_runtime_compiler(root, pinned, out)'
          count = chunk.count(old_runtime)
          if count != 2:
              raise SystemExit(f'expected 2 rebuild runtime fallback sites, found {count}')
          chunk = chunk.replace(old_runtime, 'runtime = _ensure_runtime_compiler_wasm(root, out)')
          text = text[:start] + chunk + text[end:]

          path.write_text(text, encoding='utf-8')
          PY
          git config user.name wogikaze
          git config user.email 134709039+wogikaze@users.noreply.github.com
          git rm .github/workflows/pr43-self-patch.yml
          git add scripts/selfhost/checks.py
          git diff --cached --check
          git commit -m 'fix(selfhost): canonicalize bootstrap alias imports'
          git push origin HEAD:fix/wasm-gc-type-plan-owner-phase1

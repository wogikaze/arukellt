name: Temporary proof phase57 docs sync
on:
  push:
    branches: [agent/proof-phase-5-7]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate docs
        run: python3 scripts/gen/generate-docs.py
      - name: Commit generated docs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs
          git commit -m "docs: regenerate generated documentation"
          git push origin HEAD:agent/proof-phase-5-7

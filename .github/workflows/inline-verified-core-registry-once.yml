name: Inline VerifiedCore registry once

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/typed-verified-core-emitter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typed-verified-core-emitter
          fetch-depth: 0

      - name: Inline registry mutation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/compiler/driver/verified_core_render.ark')
          text = path.read_text()

          def replace(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'expected source block missing:\n{old}')
              text = text.replace(old, new, 1)

          replace(
              '''fn VerifiedCoreTypeRegistry_new() -> VerifiedCoreTypeRegistry {
              let registry = VerifiedCoreTypeRegistry {
                  ok: true,
                  error: "",
                  names: Vec::new<String>(),
                  value_types: Vec::new<i32>(),
              }
              let registered_unit_type = vc_register_type(registry.names, registry.value_types, value_types::VT_VOID(), "()")
              registry
          }
          ''',
              '''fn VerifiedCoreTypeRegistry_new() -> VerifiedCoreTypeRegistry {
              let names = Vec::new<String>()
              let registered_value_types = Vec::new<i32>()
              push(names, "()")
              push(registered_value_types, value_types::VT_VOID())
              VerifiedCoreTypeRegistry {
                  ok: true,
                  error: "",
                  names: names,
                  value_types: registered_value_types,
              }
          }
          '''
          )

          start = text.index('fn vc_register_type(')
          end = text.index('fn vc_find_type(', start)
          text = text[:start] + text[end:]

          replace(
              '''let registered_parameter_type = vc_register_type(
                          registry.names,
                          registry.value_types,
                          param::param_value_type(p),
                          param::param_type_name(p)
                      )
                      if registered_parameter_type < 0 {
                          registry.ok = false
                          registry.error = concat("VerifiedCore requires an explicit parameter type for function index ", to_string(fi))
                      }''',
              '''let parameter_value_type = param::param_value_type(p)
                      let parameter_type_name = param::param_type_name(p)
                      let normalized_parameter_type = vc_normalize_type_name(parameter_value_type, clone(parameter_type_name))
                      if len(clone(normalized_parameter_type)) == 0 {
                          registry.ok = false
                          registry.error = concat("VerifiedCore requires an explicit parameter type for function index ", to_string(fi))
                      } else if vc_find_type(registry, parameter_value_type, parameter_type_name) < 0 {
                          push(registry.names, normalized_parameter_type)
                          push(registry.value_types, parameter_value_type)
                      }'''
          )

          replace(
              '''let registered_return_type = vc_register_type(
                              registry.names,
                              registry.value_types,
                              return_vt,
                              name_display::type_display_name(return_type)
                          )
                          if registered_return_type < 0 {
                              registry.ok = false
                              registry.error = concat("VerifiedCore requires an explicit return type for function index ", to_string(fi))
                          }''',
              '''let return_type_name = name_display::type_display_name(return_type)
                          let normalized_return_type = vc_normalize_type_name(return_vt, clone(return_type_name))
                          if len(clone(normalized_return_type)) == 0 {
                              registry.ok = false
                              registry.error = concat("VerifiedCore requires an explicit return type for function index ", to_string(fi))
                          } else if vc_find_type(registry, return_vt, return_type_name) < 0 {
                              push(registry.names, normalized_return_type)
                              push(registry.value_types, return_vt)
                          }'''
          )

          replace(
              '''let registered_expression_type = vc_register_type(
                          registry.names,
                          registry.value_types,
                          expr_raw::corehir_expr_val_type(expr),
                          expr_raw::corehir_expr_type_name(expr)
                      )
                      if registered_expression_type < 0 {
                          registry.ok = false
                          registry.error = concat("VerifiedCore requires an explicit expression type for expression ", to_string(ei))
                      }''',
              '''let expression_value_type = expr_raw::corehir_expr_val_type(expr)
                      let expression_type_name = expr_raw::corehir_expr_type_name(expr)
                      let normalized_expression_type = vc_normalize_type_name(expression_value_type, clone(expression_type_name))
                      if len(clone(normalized_expression_type)) == 0 {
                          registry.ok = false
                          registry.error = concat("VerifiedCore requires an explicit expression type for expression ", to_string(ei))
                      } else if vc_find_type(registry, expression_value_type, expression_type_name) < 0 {
                          push(registry.names, normalized_expression_type)
                          push(registry.value_types, expression_value_type)
                      }'''
          )

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'registry already inlined'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/driver/verified_core_render.ark
          git commit -m 'fix(proof): inline VerifiedCore type registration'
          git push origin HEAD:agent/typed-verified-core-emitter

name: TypedCoreHIR proof Phase 5

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: typed-corehir-proof-p5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase5-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Phase 3-5 boundaries
        run: |
          python3 scripts/check/check-proof-phase3-modular.py
          python3 scripts/check/check-proof-phase5-boundary.py
          python3 scripts/gen/write-typed-verified-core-boundary-receipt-v5.py --output .build/proof/typed-verified-core-boundary-v5.json
          python3 scripts/check/check-typed-verified-core-boundary-receipt-v5.py .build/proof/typed-verified-core-boundary-v5.json
      - name: Run Phase 3-5 proof tests
        run: |
          python3 -m unittest \
            scripts.tests.test_proof_phase3_calls \
            scripts.tests.test_loop_proof_v4 \
            scripts.tests.test_proof_phase5_aggregates
      - name: Run regression proof tests
        run: |
          python3 -m unittest \
            scripts.tests.test_typed_corehir_convert \
            scripts.tests.test_verified_core_typed \
            scripts.tests.test_smtlib_typed_v1 \
            scripts.tests.test_proof_program_phases
      - uses: actions/upload-artifact@v4
        with:
          name: proof-phase5-boundary
          path: .build/proof/typed-verified-core-boundary-v5.json
          if-no-files-found: error

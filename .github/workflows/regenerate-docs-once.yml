name: Regenerate docs once

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: regenerate-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'agent/formal-verification-hard-gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/formal-verification-hard-gates
          fetch-depth: 0

      - name: Regenerate documentation
        run: python3 scripts/gen/generate-docs.py

      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo 'generated docs already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs
          git commit -m 'docs: regenerate generated documentation'
          git push origin HEAD:agent/formal-verification-hard-gates

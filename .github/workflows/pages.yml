name: Deploy Docs

on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "playground/**"
      - "tools/board/**"
      - "issues/**"
      - "bootstrap/**"
      - "std/manifest.toml"
      - "src/compiler/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wasmtime
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors \
            https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: Install wasm-tools
        run: |
          set -euo pipefail
          version=1.252.0
          mkdir -p "$HOME/.local/bin"
          curl --retry 5 --retry-delay 2 --retry-all-errors \
            -L --proto '=https' --tlsv1.2 -sSf \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${version}/wasm-tools-${version}-x86_64-linux.tar.gz" \
            | tar -xz -O "wasm-tools-${version}-x86_64-linux/wasm-tools" > "$HOME/.local/bin/wasm-tools"
          chmod +x "$HOME/.local/bin/wasm-tools"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wasm-tools" --version

      - name: Selfhost fixpoint (stage-3 compiler for playground Run)
        run: python3 scripts/manager.py selfhost fixpoint --build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build playground JS
        working-directory: playground
        run: npm install --no-audit --no-fund --package-lock=false && npm run build:app

      - name: Build board for Pages
        working-directory: tools/board
        run: npm ci && npm run build:pages

      - name: Generate stdlib HTML docs
        run: |
          mkdir -p docs/docs/std
          scripts/run/arukellt-selfhost.sh doc --html -o docs/docs/std/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: PR43 apply bootstrap WIT scan dependency fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/wasm-gc-type-plan-owner-phase1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wasm-gc-type-plan-owner-phase1
          fetch-depth: 0
      - name: Patch selfhost overlay dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/selfhost/checks.py')
          text = path.read_text()
          old_hash = '''        "std/text/mod.ark",\n        "std/wit/names.ark",\n    ):\n'''
          new_hash = '''        "std/text/mod.ark",\n        "std/wit/names.ark",\n        "std/wit/scan.ark",\n    ):\n'''
          if old_hash not in text:
              raise SystemExit('source-hash anchor not found')
          text = text.replace(old_hash, new_hash, 1)
          old_copy = '''    wit_names_src = root / "std" / "wit" / "names.ark"\n    if wit_names_src.is_file():\n        wit_dst = std_dst / "wit"\n        wit_dst.mkdir(exist_ok=True)\n        shutil.copyfile(wit_names_src, wit_dst / "names.ark")\n    _FLAT_OVERLAY_CACHE = (source_mtime, overlay_root)\n'''
          new_copy = '''    wit_dst = std_dst / "wit"\n    wit_dst.mkdir(exist_ok=True)\n    for wit_name in ("names.ark", "scan.ark"):\n        wit_src = root / "std" / "wit" / wit_name\n        if wit_src.is_file():\n            shutil.copyfile(wit_src, wit_dst / wit_name)\n    _FLAT_OVERLAY_CACHE = (source_mtime, overlay_root)\n'''
          if old_copy not in text:
              raise SystemExit('std WIT copy anchor not found')
          text = text.replace(old_copy, new_copy, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- scripts/selfhost/checks.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/selfhost/checks.py
          git commit -m "fix(selfhost): include WIT scan helper in bootstrap overlay"
          git push origin HEAD:fix/wasm-gc-type-plan-owner-phase1

name: VerifiedCore emitter

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates, master]
  workflow_dispatch:

concurrency:
  group: verified-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verified-core-emitter:
    name: "VerifiedCore emitter"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate host-side artifact contracts
        run: |
          python3 -m unittest scripts.tests.test_proof_artifacts
          python3 scripts/check/check-formal-verification-gates.py tests/proof/proof-required-policy.json

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build wasm-heap-grow-patcher
        run: cargo build --release --quiet
        working-directory: scripts/bootstrap/wasm-heap-grow-patcher

      - name: Build host-linker
        run: |
          cargo build --release --quiet
          cargo test --lib --no-run --quiet
        working-directory: tools/host-linker

      - name: Build current selfhost compiler
        run: |
          python3 scripts/manager.py selfhost fixpoint --build
          test -s .build/selfhost/arukellt-s2.wasm
          test -s .build/selfhost/arukellt-s3.wasm
          cmp .build/selfhost/arukellt-s2.wasm .build/selfhost/arukellt-s3.wasm

      - name: Validate emitted VerifiedCore
        run: python3 scripts/check/check-verified-core-emission.py

name: Patch backend name lookup audit once

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/backend-name-lookup-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/backend-name-lookup-audit
          fetch-depth: 0

      - name: Add successful name lookup accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing {label}')
              return text.replace(old, new, 1)

          table = Path('src/compiler/wasm/gc_layout_table.ark')
          text = table.read_text()
          if 'name_lookup_count: i32' not in text:
              text = replace_once(text,
                  '    typed_lookup_count: i32,\n    fallback_lookup_count: i32,',
                  '    typed_lookup_count: i32,\n    name_lookup_count: i32,\n    fallback_lookup_count: i32,',
                  'table counter field')
              text = replace_once(text,
                  '        typed_lookup_count: 0,\n        fallback_lookup_count: 0,',
                  '        typed_lookup_count: 0,\n        name_lookup_count: 0,\n        fallback_lookup_count: 0,',
                  'table counter initialization')
              text = replace_once(text,
                  'fn gc_layout_table_observe_fallback_lookup(table: GcLayoutTable) {',
                  'fn gc_layout_table_observe_name_lookup(table: GcLayoutTable) {\n    table.name_lookup_count = table.name_lookup_count + 1\n}\n\nfn gc_layout_table_observe_fallback_lookup(table: GcLayoutTable) {',
                  'counter observer')
              text = replace_once(text,
                  'fn gc_layout_table_fallback_lookup_count(table: GcLayoutTable) -> i32 {',
                  'fn gc_layout_table_name_lookup_count(table: GcLayoutTable) -> i32 {\n    table.name_lookup_count\n}\n\nfn gc_layout_table_fallback_lookup_count(table: GcLayoutTable) -> i32 {',
                  'counter accessor')
              table.write_text(text)

          lookup = Path('src/compiler/wasm/ctx_gc_layout_lookup.ark')
          text = lookup.read_text()
          if 'gc_layout_table_observe_name_lookup' not in text:
              text = replace_once(text,
                  '    if tid_result >= 0 {\n        return tid_result\n    }',
                  '    if tid_result >= 0 {\n        gc_layout_table::gc_layout_table_observe_name_lookup(\n            ctx_record::SelfEmitCtx_gc_layout_table(ctx)\n        )\n        return tid_result\n    }',
                  'successful lookup observation')
              lookup.write_text(text)

          audit = Path('src/compiler/wasm/gc_layout_audit.ark')
          text = audit.read_text()
          if 'let name_count =' not in text:
              text = replace_once(text,
                  '    let typed_count = gc_layout_table::gc_layout_table_typed_lookup_count(table)\n    let fallback_count',
                  '    let typed_count = gc_layout_table::gc_layout_table_typed_lookup_count(table)\n    let name_count = gc_layout_table::gc_layout_table_name_lookup_count(table)\n    let fallback_count',
                  'audit counter read')
              text = replace_once(text,
                  '    if typed_count <= 0 && fallback_count <= 0 && conflict_count <= 0 {',
                  '    if typed_count <= 0 && name_count <= 0 && fallback_count <= 0 && conflict_count <= 0 {',
                  'audit empty summary guard')
              text = replace_once(text,
                  '            i32_to_string(typed_count),\n            concat(\n                " fallback=",',
                  '            i32_to_string(typed_count),\n            concat(\n                " name=",\n                concat(\n                    i32_to_string(name_count),\n                    concat(\n                        " fallback=",',
                  'audit summary prefix')
              text = replace_once(text,
                  '                    concat(" conflict=", i32_to_string(conflict_count))\n                )\n            )\n        )\n    )',
                  '                    concat(" conflict=", i32_to_string(conflict_count))\n                )\n                    )\n                )\n            )\n        )\n    )',
                  'audit summary suffix')
              audit.write_text(text)
          PY

      - name: Validate and commit patch
        run: |
          python3 scripts/check/check-backend-name-lookup-audit.py
          if git diff --quiet; then
            echo 'audit patch already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/wasm/gc_layout_table.ark src/compiler/wasm/ctx_gc_layout_lookup.ark src/compiler/wasm/gc_layout_audit.ark
          git commit -m 'feat(proof): count backend name-based layout lookups'
          git push origin HEAD:agent/backend-name-lookup-audit

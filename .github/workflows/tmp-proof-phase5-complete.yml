name: Temporary proof phase5 complete validation
permissions:
  contents: write
on:
  push:
    branches: [feature/proof-phase5-complete-validation]
jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-complete-green]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q scripts
      - run: python3 scripts/check/check-proof-phase3-modular.py
      - run: python3 scripts/check/check-proof-phase5-boundary.py
      - run: python3 -m unittest scripts.tests.test_typed_corehir_convert scripts.tests.test_verified_core_typed scripts.tests.test_smtlib_typed_v1 scripts.tests.test_proof_program_phases scripts.tests.test_proof_phase3_calls scripts.tests.test_loop_proof_v4 scripts.tests.test_proof_phase5_final scripts.tests.test_typed_corehir_v2_aggregates
      - run: python3 scripts/gen/write-proof-phase5-boundary-receipt-final.py --output .build/proof/proof-phase5-boundary-final.json
      - run: python3 scripts/check/check-proof-phase5-boundary-final.py .build/proof/proof-phase5-boundary-final.json
      - name: Mark green
        run: |
          mkdir -p .ci
          printf '%s\n' "$GITHUB_SHA" > .ci/proof-phase5-complete-green
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .ci/proof-phase5-complete-green
          git commit -m '[phase5-complete-green] ci: complete proof phase5 passed'
          git push

name: Proof gate diagnostic

on:
  pull_request:
    branches: [master]

concurrency:
  group: proof-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proof-gate-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build wasm-heap-grow-patcher
        run: cargo build --release --quiet
        working-directory: scripts/bootstrap/wasm-heap-grow-patcher

      - name: Build current selfhost compiler
        run: python3 scripts/manager.py selfhost fixpoint --build

      - name: Check Proof IR unit boundary
        run: |
          python3 -m unittest scripts.tests.test_proof_ir
          python3 scripts/check/check-proof-ir.py tests/proof-ir/basic.json

      - name: Diagnose contract retention
        run: |
          set +e
          echo "=== SOURCE ==="
          cat tests/proof-contracts/valid.ark
          echo "=== AST DUMP ==="
          scripts/run/arukellt-selfhost.sh compile tests/proof-contracts/valid.ark --dump-phases ast
          echo "ast rc=$?"
          echo "=== HIR DUMP ==="
          scripts/run/arukellt-selfhost.sh compile tests/proof-contracts/valid.ark --dump-phases hir
          echo "hir rc=$?"
          echo "=== PROOF IR DUMP ==="
          scripts/run/arukellt-selfhost.sh compile tests/proof-contracts/valid.ark --dump-phases proof-ir
          echo "proof rc=$?"
          exit 0

      - name: Check Proof IR frontend E2E
        run: python3 scripts/check/check-proof-contract-frontend.py

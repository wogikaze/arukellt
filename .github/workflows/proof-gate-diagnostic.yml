name: Proof gate diagnostic

on:
  pull_request:
    branches: [master]

concurrency:
  group: proof-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proof-gate-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build wasm-heap-grow-patcher
        run: cargo build --release --quiet
        working-directory: scripts/bootstrap/wasm-heap-grow-patcher

      - name: Build current selfhost compiler
        run: python3 scripts/manager.py selfhost fixpoint --build

      - name: Inspect flattened Proof IR modules
        run: |
          workspace=".build/selfhost/bootstrap-workspace"
          echo "=== matching flattened files ==="
          find "$workspace" -type f | grep -E '(driver_debug|proof_ir|corehir)' | sort || true
          echo "=== flattened Proof IR references ==="
          grep -R -n -E 'proof_ir_render|render_proof_ir' "$workspace" || true

      - name: Identify Proof IR generated functions
        run: |
          if ! command -v wasm-objdump >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq wabt
          fi
          wasm=".build/selfhost/arukellt-s3.wasm"
          wasm-objdump -x "$wasm" |
            grep -E '<(dump_proof_ir_if_enabled|render_proof_ir|render_proof_ir_document)>' || true
          disasm="$(mktemp)"
          wasm-objdump -d "$wasm" > "$disasm"
          for symbol in dump_proof_ir_if_enabled render_proof_ir render_proof_ir_document; do
            echo "=== ${symbol} disassembly ==="
            awk -v symbol="$symbol" '
              $0 ~ "<" symbol ">:" { show=1 }
              show && $0 !~ "<" symbol ">:" && $0 ~ /^[0-9a-f]+ func\[/ { exit }
              show { print }
            ' "$disasm"
          done
          wasm-validate "$wasm"

      - name: Check Proof IR unit boundary
        run: |
          python3 -m unittest scripts.tests.test_proof_ir
          python3 scripts/check/check-proof-ir.py tests/proof-ir/basic.json

      - name: Diagnose contract retention
        run: |
          set +e
          echo "=== SOURCE ==="
          cat tests/proof-contracts/valid.ark
          echo "=== AST DUMP ==="
          scripts/run/arukellt-selfhost.sh compile tests/proof-contracts/valid.ark --dump-phases ast
          echo "ast rc=$?"
          echo "=== HIR DUMP ==="
          scripts/run/arukellt-selfhost.sh compile tests/proof-contracts/valid.ark --dump-phases hir
          echo "hir rc=$?"
          echo "=== PROOF IR DUMP ==="
          scripts/run/arukellt-selfhost.sh compile tests/proof-contracts/valid.ark --dump-phases proof-ir
          echo "proof rc=$?"
          exit 0

      - name: Check Proof IR frontend E2E
        run: python3 scripts/check/check-proof-contract-frontend.py

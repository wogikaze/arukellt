name: PR43 Wasm GC targeted diagnostics

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  targeted:
    if: github.head_ref == 'fix/wasm-gc-type-plan-owner-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wasm-gc-type-plan-owner-phase1
          fetch-depth: 0
      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Install wasm-tools
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm wasm-tools
      - name: Build current compiler
        run: python3 scripts/manager.py selfhost build-compiler
      - name: Inspect current s2 runtime
        run: |
          mkdir -p .build/pr43-debug
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          wasm = Path('.build/selfhost/arukellt-s2-runtime.wasm')
          if not wasm.exists():
              raise SystemExit('missing s2 runtime')
          validate = subprocess.run(
              ['wasm-tools', 'validate', '--features', 'gc', str(wasm)],
              capture_output=True,
              text=True,
          )
          output = (validate.stdout or '') + (validate.stderr or '')
          print(f's2_validate_exit={validate.returncode}')
          print(output)
          if validate.returncode == 0:
              raise SystemExit(0)
          matches = re.findall(r'(?:func|function)\s*\[?(\d+)\]?', output)
          target = int(matches[-1]) if matches else 6697
          printed = subprocess.run(['wasm-tools', 'print', str(wasm)], capture_output=True, text=True)
          if printed.returncode != 0:
              print((printed.stdout or '') + (printed.stderr or ''))
              raise SystemExit(0)
          Path('.build/pr43-debug/s2.wat').write_text(printed.stdout)
          lines = printed.stdout.splitlines()
          needle = f'(func (;{target};)'
          hits = [i for i, line in enumerate(lines) if needle in line]
          print(f's2_validator_func={target}')
          if not hits:
              print('function unavailable in WAT')
              raise SystemExit(0)
          start = max(0, hits[0] - 30)
          end = min(len(lines), hits[0] + 280)
          for i in range(start, end):
              print(f'{i+1}: {lines[i]}')
          PY
      - name: Compile and validate representative fixtures
        run: |
          set +e
          failed=0
          for spec in \
            'array:tests/fixtures/arrays/array_literal.ark' \
            'trait:tests/fixtures/generics_v1/trait_method_resolve.ark'; do
            name=${spec%%:*}
            src=${spec#*:}
            out=.build/pr43-debug/${name}.wasm
            ARUKELLT_SELFHOST_WASM=.build/selfhost/arukellt-s2-runtime.wasm \
              bash scripts/run/arukellt-selfhost.sh compile "$src" --target wasm32-gc -o "$out" \
              2>&1 | tee .build/pr43-debug/${name}-compile.log
            c=${PIPESTATUS[0]}
            v=99
            if [ "$c" -eq 0 ] && [ -f "$out" ]; then
              wasm-tools validate --features gc "$out" 2>&1 | tee .build/pr43-debug/${name}-validate.log
              v=${PIPESTATUS[0]}
            fi
            echo "$name compile=$c validate=$v"
            if [ "$c" -ne 0 ] || [ "$v" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: True fixpoint probe
        run: |
          set -o pipefail
          python3 scripts/manager.py selfhost fixpoint --build 2>&1 | tee .build/pr43-debug/fixpoint.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] || grep -q 'stage 3 compilation failed\|stage 3 wasm failed validation\|fixpoint not yet reached' .build/pr43-debug/fixpoint.log; then
            exit 1
          fi

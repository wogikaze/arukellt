name: CI

on:
  push:
    branches: [master, "feature/**"]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Interactive CI has a hard <10 minute feedback SLO. Exhaustive validation is
# intentionally separated into full-validation.yml so it cannot block PR work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ark-changes:
    name: "Ark change selection"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      count: ${{ steps.ark.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Count changed Ark sources
        id: ark
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          count="$({ git diff --name-only --diff-filter=ACMR "$base"...HEAD \
            | grep -E '^(src/compiler|std)/.*\.ark$' || true; } \
            | while IFS= read -r path; do [[ -f "$path" ]] && printf '%s\n' "$path"; done \
            | wc -l | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Ark sources changed: $count"

  quality-shard:
    name: "quality-shard-${{ matrix.shard }}"
    if: needs.ark-changes.outputs.count != '0'
    needs: ark-changes
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Ark shard
        id: shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          { git diff --name-only --diff-filter=ACMR "$base"...HEAD \
            | grep -E '^(src/compiler|std)/.*\.ark$' || true; } > "$RUNNER_TEMP/all-ark.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          shard = int(os.environ["SHARD"])
          root = Path.cwd()
          paths = [p for p in Path(os.environ["RUNNER_TEMP"]).joinpath("all-ark.txt").read_text().splitlines() if (root / p).is_file()]
          selected = [p for i, p in enumerate(paths) if i % 8 == shard]
          Path(os.environ["RUNNER_TEMP"]).joinpath("shard-ark.txt").write_text("".join(p + "\n" for p in selected))
          PY
          count="$(wc -l < "$RUNNER_TEMP/shard-ark.txt" | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Shard $SHARD Ark sources: $count"

      - name: Install wasmtime
        if: steps.shard.outputs.count != '0'
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build host runner
        if: steps.shard.outputs.count != '0'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --quiet --bin arukellt-host-run
        working-directory: tools/host-linker

      - name: Full format and bounded lint
        if: steps.shard.outputs.count != '0'
        shell: bash
        env:
          ARUKELLT_SELFHOST_WASM: ${{ github.workspace }}/bootstrap/arukellt-selfhost.wasm
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/shard-ark.txt"
          wrapper="scripts/run/arukellt-selfhost.sh"
          pids=()
          labels=()

          # The pinned formatter supports multiple inputs. Keep each invocation
          # at <=5 files to bound wasm memory while amortizing cold start.
          batch_no=0
          for ((start=0; start<${#files[@]}; start+=5)); do
            batch=("${files[@]:start:5}")
            ("$wrapper" fmt --check "${batch[@]}") &
            pids+=("$!")
            labels+=("fmt-batch-$batch_no")
            batch_no=$((batch_no + 1))
          done

          # The pinned lint CLI is single-input. PR CI samples one deterministic
          # file per shard; exhaustive lint remains in full-validation.
          sample="${files[0]}"
          echo "PR lint sample: $sample"
          ("$wrapper" lint --local "$sample") &
          pids+=("$!")
          labels+=("lint-sample")

          rc=0
          set +e
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}"
            child_rc=$?
            if [[ "$child_rc" -ne 0 ]]; then
              echo "${labels[$i]} failed with rc=$child_rc" >&2
              rc=1
            fi
          done
          set -e
          exit "$rc"

  quality-format:
    name: "quality-format"
    if: always()
    needs: [ark-changes, quality-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Aggregate formatting shards
        env:
          SHARD_RESULT: ${{ needs.quality-shard.result }}
        run: |
          set -euo pipefail
          # Shards implement: python3 scripts/manager.py fmt --check
          case "$SHARD_RESULT" in
            success|skipped) exit 0 ;;
            *) echo "formatting shard result: $SHARD_RESULT" >&2; exit 1 ;;
          esac

  quality-lint:
    name: "quality-lint"
    if: always()
    needs: [ark-changes, quality-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Aggregate lint shards
        env:
          SHARD_RESULT: ${{ needs.quality-shard.result }}
        run: |
          set -euo pipefail
          # Shards implement: python3 scripts/manager.py lint
          case "$SHARD_RESULT" in
            success|skipped) exit 0 ;;
            *) echo "lint shard result: $SHARD_RESULT" >&2; exit 1 ;;
          esac

  verify-quick:
    name: "verify-quick"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fast repository contracts
        run: |
          set -euo pipefail
          test -f bootstrap/arukellt-selfhost.wasm
          python3 scripts/check/check-docs-consistency.py
          python3 scripts/check/check-native-executor-ci-contract.py
          python3 scripts/check/check-native-cpp-capabilities.py
          python3 scripts/check/check-native-cpp-safepoint-audit.py

  verification:
    name: "Verification harness"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python gate smoke
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest scripts.tests.test_gate

  selfhost:
    name: "Selfhost gates"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Validate pinned bootstrap
        run: |
          wasmtime compile \
            --wasm gc \
            --wasm function-references \
            -W memory64=y \
            -W max-memory-size=17179869184 \
            bootstrap/arukellt-selfhost.wasm \
            -o "$RUNNER_TEMP/arukellt-selfhost.cwasm"

  native-executor-gates:
    name: "Native executor gates"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Native source and contract gates
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: |
          set -euo pipefail
          python3 scripts/check/check-native-cpp-capabilities.py
          python3 scripts/check/check-native-cpp-safepoint-audit.py
          python3 scripts/check/check-native-executor-ci-contract.py

  docs:
    name: "Docs consistency"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check docs consistency
        run: python3 scripts/check/check-docs-consistency.py

  extension-tests:
    name: "VS Code extension E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect extension changes
        id: ext
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          if git diff --name-only "$base"...HEAD | grep -q '^extensions/arukellt-all-in-one/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fast extension syntax/package check
        if: steps.ext.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node --check extensions/arukellt-all-in-one/src/extension.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("extensions/arukellt-all-in-one/package.json").read_text())
          json.loads(Path("extensions/arukellt-all-in-one/package-lock.json").read_text())
          PY

  release-tag:
    name: "Release tag version"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag
        run: python3 scripts/check/check-release-tag-version.py --require-tag

  verify:
    name: "Final gate"
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs:
      - quality-format
      - quality-lint
      - verify-quick
      - verification
      - selfhost
      - native-executor-gates
      - docs
      - extension-tests
    steps:
      - name: Enforce fast-gate results
        env:
          RESULTS: >-
            ${{ needs.quality-format.result }}
            ${{ needs.quality-lint.result }}
            ${{ needs.verify-quick.result }}
            ${{ needs.verification.result }}
            ${{ needs.selfhost.result }}
            ${{ needs.native-executor-gates.result }}
            ${{ needs.docs.result }}
            ${{ needs.extension-tests.result }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          if grep -Eq '(^| )(failure|cancelled|timed_out|action_required|startup_failure)( |$)' <<<"$RESULTS"; then
            exit 1
          fi
          echo "Fast CI passed within the 10-minute feedback budget."

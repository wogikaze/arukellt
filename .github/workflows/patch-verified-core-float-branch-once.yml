name: Patch VerifiedCore float branch once

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/typed-verified-core-emitter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typed-verified-core-emitter
          fetch-depth: 0

      - name: Replace String-valued if expression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/compiler/driver/verified_core_render.ark')
          text = path.read_text()
          old = '''    let float_json = if kind == 7 { expr_raw::corehir_expr_text(expr) } else { "0.0" }
              out = concat(out, concat(",\\\"float_value\\\":", float_json))'''
          new = '''    let mut float_json = "0.0"
              if kind == 7 {
                  float_json = expr_raw::corehir_expr_text(expr)
              }
              out = concat(out, concat(",\\\"float_value\\\":", float_json))'''
          if old not in text:
              raise SystemExit('String-valued float if expression missing')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/driver/verified_core_render.ark
          git commit -m 'fix(proof): avoid String-valued if in renderer'
          git push origin HEAD:agent/typed-verified-core-emitter

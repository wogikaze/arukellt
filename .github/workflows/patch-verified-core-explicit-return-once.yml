name: Patch VerifiedCore explicit return once

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/typed-verified-core-emitter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typed-verified-core-emitter
          fetch-depth: 0

      - name: Add explicit expression renderer return
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/compiler/driver/verified_core_render.ark')
          text = path.read_text()
          old = '''    concat(out, "]}")
          }

          fn vc_render_abi_item'''
          new = '''    return concat(out, "]}")
          }

          fn vc_render_abi_item'''
          if old not in text:
              raise SystemExit('vc_render_expression tail missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/driver/verified_core_render.ark
          git commit -m 'fix(proof): return expression artifact explicitly'
          git push origin HEAD:agent/typed-verified-core-emitter

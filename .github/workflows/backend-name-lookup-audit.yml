name: Backend TypeId layout boundary

on:
  pull_request:
    branches: [agent/backend-typeid-first, agent/backend-name-lookup-audit, agent/formal-verification-hard-gates, master]
  workflow_dispatch:

concurrency:
  group: backend-typeid-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-typeid-layout:
    name: "Backend TypeId layout boundary"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check explicit layout-plan source contract
        run: python3 scripts/check/check-backend-name-lookup-audit.py

      - name: Check TypeId-first ordering
        run: python3 scripts/check/check-backend-typeid-first.py

      - name: Write hash-bound layout boundary receipt
        run: python3 scripts/gen/write-backend-typeid-layout-receipt.py

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build wasm-heap-grow-patcher
        run: cargo build --release --quiet
        working-directory: scripts/bootstrap/wasm-heap-grow-patcher

      - name: Build host-linker
        run: |
          cargo build --release --quiet
          cargo test --lib --no-run --quiet
        working-directory: tools/host-linker

      - name: Build and validate selfhost stages
        run: |
          set +e
          python3 scripts/manager.py selfhost fixpoint --build
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo 'selfhost stage build or validation failed'
            exit 1
          fi
          test -s .build/selfhost/arukellt-s2.wasm
          test -s .build/selfhost/arukellt-s3.wasm
          if [ "$rc" -eq 1 ]; then
            echo 's2/s3 byte fixpoint deferred while explicit layout artifacts change emitted compiler code'
          fi

      - name: Exercise TypeId-only runtime lookup
        run: python3 scripts/check/check-backend-name-lookup-runtime.py

      - name: Upload backend TypeId evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-typeid-layout-boundary
          path: |
            .build/proof/backend-typeid-layout.json
            .build/audit/backend-name-lookup.json
          if-no-files-found: error

name: Backend name lookup audit

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates, master]
  workflow_dispatch:

concurrency:
  group: backend-name-lookup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-name-lookup-audit:
    name: "Backend name lookup audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check source contract
        run: python3 scripts/check/check-backend-name-lookup-audit.py

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build wasm-heap-grow-patcher
        run: cargo build --release --quiet
        working-directory: scripts/bootstrap/wasm-heap-grow-patcher

      - name: Build host-linker
        run: |
          cargo build --release --quiet
          cargo test --lib --no-run --quiet
        working-directory: tools/host-linker

      - name: Build and validate selfhost stages
        run: |
          set +e
          python3 scripts/manager.py selfhost fixpoint --build
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo 'selfhost stage build or validation failed'
            exit 1
          fi
          test -s .build/selfhost/arukellt-s2.wasm
          test -s .build/selfhost/arukellt-s3.wasm
          if [ "$rc" -eq 1 ]; then
            echo 's2/s3 byte fixpoint deferred while backend audit instrumentation changes emitted compiler code'
          fi

      - name: Capture backend name lookup baseline
        run: python3 scripts/check/check-backend-name-lookup-runtime.py

      - name: Upload backend lookup baseline
        uses: actions/upload-artifact@v4
        with:
          name: backend-name-lookup-audit
          path: .build/audit/backend-name-lookup.json
          if-no-files-found: error

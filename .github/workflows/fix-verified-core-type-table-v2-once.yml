name: Fix VerifiedCore type table v2 once

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/typed-verified-core-emitter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typed-verified-core-emitter
          fetch-depth: 0

      - name: Replace dynamic registry with fixed type IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/compiler/driver/verified_core_render.ark')
          text = path.read_text()

          def cut(start_marker: str, end_marker: str) -> None:
              global text
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]

          registry = '''struct VerifiedCoreTypeRegistry {
              ok: bool,
              error: String,
              names: Vec<String>,
              value_types: Vec<i32>,
          }

          '''
          if registry not in text:
              raise SystemExit('registry struct missing')
          text = text.replace(registry, '', 1)

          start = text.index('fn VerifiedCoreTypeRegistry_new()')
          end = text.index('fn vc_type_info_value_type(', start)
          fixed_helpers = '''fn vc_string_has_question(s: String) -> bool {
              let n = len(s)
              let mut i = 0
              while i < n {
                  if char_at(s, i) == 63 { return true }
                  i = i + 1
              }
              false
          }

          fn vc_normalize_type_name(value_type: i32, supplied: String) -> String {
              if len(clone(supplied)) > 0 {
                  if vc_string_has_question(clone(supplied)) || eq(clone(supplied), "unknown") { return "" }
                  return supplied
              }
              if value_type == value_types::VT_VOID() { return "()" }
              if value_type == value_types::VT_I32() { return "i32" }
              if value_type == value_types::VT_I64() { return "i64" }
              if value_type == value_types::VT_F32() { return "f32" }
              if value_type == value_types::VT_F64() { return "f64" }
              if value_type == value_types::VT_V128() { return "v128" }
              if value_type == value_types::VT_FUNCREF() { return "fnref" }
              ""
          }

          fn vc_type_id(value_type: i32, supplied_name: String) -> i32 {
              let name = vc_normalize_type_name(value_type, supplied_name)
              if value_type == value_types::VT_VOID() && eq(clone(name), "()") { return 0 }
              if value_type == value_types::VT_I32() && eq(clone(name), "i32") { return 1 }
              if value_type == value_types::VT_I32() && eq(clone(name), "bool") { return 2 }
              if value_type == value_types::VT_I32() && eq(clone(name), "char") { return 3 }
              if value_type == value_types::VT_I64() && eq(clone(name), "i64") { return 4 }
              if value_type == value_types::VT_F32() && eq(clone(name), "f32") { return 5 }
              if value_type == value_types::VT_F64() && eq(clone(name), "f64") { return 6 }
              if value_type == value_types::VT_V128() && eq(clone(name), "v128") { return 7 }
              if value_type == value_types::VT_REF() && (eq(clone(name), "String") || eq(clone(name), "string")) { return 8 }
              if value_type == value_types::VT_FUNCREF() && (eq(clone(name), "fnref") || eq(clone(name), "fn")) { return 9 }
              0 - 1
          }

          fn vc_type_count() -> i32 { 10 }

          fn vc_type_name_for_id(type_id: i32) -> String {
              if type_id == 0 { return "()" }
              if type_id == 1 { return "i32" }
              if type_id == 2 { return "bool" }
              if type_id == 3 { return "char" }
              if type_id == 4 { return "i64" }
              if type_id == 5 { return "f32" }
              if type_id == 6 { return "f64" }
              if type_id == 7 { return "v128" }
              if type_id == 8 { return "String" }
              if type_id == 9 { return "fnref" }
              ""
          }

          fn vc_value_type_for_id(type_id: i32) -> i32 {
              if type_id == 0 { return value_types::VT_VOID() }
              if type_id == 1 || type_id == 2 || type_id == 3 { return value_types::VT_I32() }
              if type_id == 4 { return value_types::VT_I64() }
              if type_id == 5 { return value_types::VT_F32() }
              if type_id == 6 { return value_types::VT_F64() }
              if type_id == 7 { return value_types::VT_V128() }
              if type_id == 8 { return value_types::VT_REF() }
              if type_id == 9 { return value_types::VT_FUNCREF() }
              0 - 1
          }

          '''
          text = text[:start] + fixed_helpers + text[end:]

          # The first rewrite missed this function. Remove the complete dynamic collection pass.
          cut('fn vc_collect_types(', 'fn vc_value_type_name(')

          replacements = {
              '''fn vc_render_type(registry: VerifiedCoreTypeRegistry, type_id: i32, pointer_width: i32) -> String {
              let name = clone(registry.names[type_id])
              let value_type = registry.value_types[type_id]
          ''': '''fn vc_render_type(type_id: i32, pointer_width: i32) -> String {
              let name = vc_type_name_for_id(type_id)
              let value_type = vc_value_type_for_id(type_id)
          ''',
              'fn vc_render_expression(exprs: Vec<CoreHirExpr>, expr_id: i32, registry: VerifiedCoreTypeRegistry) -> String {':
                  'fn vc_render_expression(exprs: Vec<CoreHirExpr>, expr_id: i32) -> String {',
              'let type_id = vc_find_type(registry, value_type, expr_raw::corehir_expr_type_name(expr))':
                  'let type_id = vc_type_id(value_type, expr_raw::corehir_expr_type_name(expr))',
              '''    function_index: i32,
              registry: VerifiedCoreTypeRegistry
          ) -> VerifiedCoreRenderResult {''': '''    function_index: i32
          ) -> VerifiedCoreRenderResult {''',
              'let return_type_id = vc_find_type(registry, return_vt, name_display::type_display_name(return_type))':
                  'let return_type_id = vc_type_id(return_vt, name_display::type_display_name(return_type))',
              'let p_type_id = vc_find_type(registry, p_vt, param::param_type_name(p))':
                  'let p_type_id = vc_type_id(p_vt, param::param_type_name(p))',
              'let p_type_id = vc_find_type(registry, param::param_value_type(p), param::param_type_name(p))':
                  'let p_type_id = vc_type_id(param::param_value_type(p), param::param_type_name(p))',
              'vc_render_expression(exprs, ei, registry)': 'vc_render_expression(exprs, ei)',
              '''fn render_verified_core(program: CoreHirRawProgram, config: DriverConfig) -> VerifiedCoreRenderResult {
              let registry = VerifiedCoreTypeRegistry_new()
              vc_collect_types(program, registry)
              if !registry.ok {
                  return VerifiedCoreRenderResult_err(registry.error)
              }
          ''': 'fn render_verified_core(program: CoreHirRawProgram, config: DriverConfig) -> VerifiedCoreRenderResult {\n',
              'let type_count = len(registry.names)': 'let type_count = vc_type_count()',
              'vc_render_type(registry, ti, pointer_width)': 'vc_render_type(ti, pointer_width)',
              'vc_render_function(fn_infos, typed_fns, table, exprs, fi, registry)':
                  'vc_render_function(fn_infos, typed_fns, table, exprs, fi)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing replacement source: {old[:80]!r}')
              text = text.replace(old, new)

          needle = '''        if id < 0 || id >= expr_count {
                      return VerifiedCoreRenderResult_err(concat("VerifiedCore body references unknown expression ", to_string(id)))
                  }
                  ri = ri + 1
          '''
          replacement = '''        if id < 0 || id >= expr_count {
                      return VerifiedCoreRenderResult_err(concat("VerifiedCore body references unknown expression ", to_string(id)))
                  }
                  let reachable_expr = get_unchecked(exprs, id)
                  let reachable_type_id = vc_type_id(
                      expr_raw::corehir_expr_val_type(reachable_expr),
                      expr_raw::corehir_expr_type_name(reachable_expr)
                  )
                  if reachable_type_id < 0 {
                      return VerifiedCoreRenderResult_err(concat("VerifiedCore unsupported expression type at expression ", to_string(id)))
                  }
                  ri = ri + 1
          '''
          if needle not in text:
              raise SystemExit('reachable validation block missing')
          text = text.replace(needle, replacement, 1)

          leftovers = [
              line for line in text.splitlines()
              if 'VerifiedCoreTypeRegistry' in line or 'vc_find_type' in line or 'vc_collect_types' in line or 'registry.' in line
          ]
          if leftovers:
              raise SystemExit('dynamic registry references remain:\n' + '\n'.join(leftovers))

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/driver/verified_core_render.ark
          git commit -m 'fix(proof): use fixed VerifiedCore type identities'
          git push origin HEAD:agent/typed-verified-core-emitter

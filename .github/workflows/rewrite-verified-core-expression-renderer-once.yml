name: Rewrite VerifiedCore expression renderer once

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/typed-verified-core-emitter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typed-verified-core-emitter
          fetch-depth: 0

      - name: Rewrite expression renderer without nested value expressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/compiler/driver/verified_core_render.ark')
          text = path.read_text()
          start = text.index('fn vc_render_expression(')
          end = text.index('fn vc_render_abi_item(', start)
          replacement = '''fn vc_render_expression(program: CoreHirRawProgram, expr_id: i32) -> String {
              let table = raw_bodies::program_body_table(program)
              let exprs = body_table::corehir_body_table_exprs(table)
              let expr = get_unchecked(exprs, expr_id)
              let kind = expr_raw::corehir_expr_kind(expr)
              let value_type = expr_raw::corehir_expr_val_type(expr)
              let type_name = expr_raw::corehir_expr_type_name(expr)
              let type_id = vc_type_id(value_type, type_name)

              let mut out = "{\\\"id\\\":"
              out = concat(out, to_string(expr_id))
              out = concat(out, ",\\\"kind\\\":")
              let kind_name = vc_expr_kind_name(kind)
              out = concat(out, vc_quote(kind_name))
              out = concat(out, ",\\\"kind_id\\\":")
              out = concat(out, to_string(kind))
              out = concat(out, ",\\\"type_id\\\":")
              out = concat(out, to_string(type_id))
              out = concat(out, ",\\\"value_type\\\":")
              let value_type_name = vc_value_type_name(value_type)
              out = concat(out, vc_quote(value_type_name))
              out = concat(out, ",\\\"text\\\":")
              let expression_text = expr_raw::corehir_expr_text(expr)
              out = concat(out, vc_quote(expression_text))
              out = concat(out, ",\\\"int_value\\\":")
              let int_value = expr_raw::corehir_expr_int_val(expr)
              out = concat(out, to_string(int_value))

              let mut float_json = "0.0"
              if kind == 7 {
                  float_json = expr_raw::corehir_expr_text(expr)
              }
              out = concat(out, ",\\\"float_value\\\":")
              out = concat(out, float_json)

              let span_start = expr_raw::corehir_expr_span_start(expr)
              let mut normalized_span_start = span_start
              if normalized_span_start < 0 {
                  normalized_span_start = 0
              }
              out = concat(out, ",\\\"span_start\\\":")
              out = concat(out, to_string(normalized_span_start))
              out = concat(out, ",\\\"children\\\":[")

              let child_count = expr_raw::corehir_expr_child_count(expr)
              let mut ci = 0
              while ci < child_count {
                  if ci > 0 {
                      out = concat(out, ",")
                  }
                  let child_id = expr_raw::corehir_expr_child(expr, ci)
                  out = concat(out, to_string(child_id))
                  ci = ci + 1
              }
              out = concat(out, "]}")
              return out
          }

          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/driver/verified_core_render.ark
          git commit -m 'fix(proof): simplify VerifiedCore expression rendering'
          git push origin HEAD:agent/typed-verified-core-emitter

name: Patch VerifiedCore registry once

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/typed-verified-core-emitter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typed-verified-core-emitter
          fetch-depth: 0

      - name: Rewrite registry mutation boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/compiler/driver/verified_core_render.ark')
          text = path.read_text()

          def replace(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'expected source block missing:\n{old}')
              text = text.replace(old, new, 1)

          replace(
              '''fn vc_registry_fail(registry: VerifiedCoreTypeRegistry, message: String) {
              if registry.ok {
                  registry.ok = false
                  registry.error = message
              }
          }

          ''',
              ''
          )

          replace(
              '''fn vc_register_type(registry: VerifiedCoreTypeRegistry, value_type: i32, supplied_name: String) -> i32 {
              if !registry.ok {
                  return 0 - 1
              }
              let name = vc_normalize_type_name(value_type, supplied_name)
              if len(clone(name)) == 0 {
                  vc_registry_fail(
                      registry,
                      concat("VerifiedCore requires an explicit type name for value type ", to_string(value_type))
                  )
                  return 0 - 1
              }
              let count = len(registry.names)
              let mut i = 0
              while i < count {
                  if registry.value_types[i] == value_type && eq(clone(registry.names[i]), clone(name)) {
                      return i
                  }
                  i = i + 1
              }
              push(registry.names, name)
              push(registry.value_types, value_type)
              count
          }
          ''',
              '''fn vc_register_type(
              names: Vec<String>,
              registered_value_types: Vec<i32>,
              value_type: i32,
              supplied_name: String
          ) -> i32 {
              let name = vc_normalize_type_name(value_type, supplied_name)
              if len(clone(name)) == 0 {
                  return 0 - 1
              }
              let count = len(names)
              let mut i = 0
              while i < count {
                  if registered_value_types[i] == value_type && eq(clone(names[i]), clone(name)) {
                      return i
                  }
                  i = i + 1
              }
              push(names, name)
              push(registered_value_types, value_type)
              count
          }
          '''
          )

          replace(
              'let registered_unit_type = vc_register_type(registry, value_types::VT_VOID(), "()")',
              'let registered_unit_type = vc_register_type(registry.names, registry.value_types, value_types::VT_VOID(), "()")'
          )

          replace(
              '''let registered_parameter_type = vc_register_type(
                          registry,
                          param::param_value_type(p),
                          param::param_type_name(p)
                      )''',
              '''let registered_parameter_type = vc_register_type(
                          registry.names,
                          registry.value_types,
                          param::param_value_type(p),
                          param::param_type_name(p)
                      )
                      if registered_parameter_type < 0 {
                          registry.ok = false
                          registry.error = concat("VerifiedCore requires an explicit parameter type for function index ", to_string(fi))
                      }'''
          )

          replace(
              '''vc_registry_fail(registry, concat("VerifiedCore missing TypedFn for function index ", to_string(fi)))''',
              '''registry.ok = false
                  registry.error = concat("VerifiedCore missing TypedFn for function index ", to_string(fi))'''
          )

          replace(
              '''vc_registry_fail(registry, concat("VerifiedCore unsupported return type for function index ", to_string(fi)))''',
              '''registry.ok = false
                      registry.error = concat("VerifiedCore unsupported return type for function index ", to_string(fi))'''
          )

          replace(
              '''let registered_return_type = vc_register_type(
                              registry,
                              return_vt,
                              name_display::type_display_name(return_type)
                          )''',
              '''let registered_return_type = vc_register_type(
                              registry.names,
                              registry.value_types,
                              return_vt,
                              name_display::type_display_name(return_type)
                          )
                          if registered_return_type < 0 {
                              registry.ok = false
                              registry.error = concat("VerifiedCore requires an explicit return type for function index ", to_string(fi))
                          }'''
          )

          replace(
              '''vc_registry_fail(registry, concat("VerifiedCore contains unsupported CoreHIR expression ", to_string(ei)))''',
              '''registry.ok = false
                  registry.error = concat("VerifiedCore contains unsupported CoreHIR expression ", to_string(ei))'''
          )

          replace(
              '''let registered_expression_type = vc_register_type(
                          registry,
                          expr_raw::corehir_expr_val_type(expr),
                          expr_raw::corehir_expr_type_name(expr)
                      )''',
              '''let registered_expression_type = vc_register_type(
                          registry.names,
                          registry.value_types,
                          expr_raw::corehir_expr_val_type(expr),
                          expr_raw::corehir_expr_type_name(expr)
                      )
                      if registered_expression_type < 0 {
                          registry.ok = false
                          registry.error = concat("VerifiedCore requires an explicit expression type for expression ", to_string(ei))
                      }'''
          )

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'registry patch already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/driver/verified_core_render.ark
          git commit -m 'fix(proof): avoid registry struct mutation across call boundary'
          git push origin HEAD:agent/typed-verified-core-emitter

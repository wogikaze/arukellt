name: WASI runtime ABI production

on:
  pull_request:
    paths:
      - "src/compiler/wasm/**"
      - "std/host/**"
      - "data/core-ops.toml"
      - "runtime/wasi-p2-adapter/**"
      - "runtime/wasi-p2-bridge/**"
      - "tools/host-linker/**"
      - "scripts/run/**"
      - "scripts/dev/apply-wasi-runtime-abi-rename.py"
      - "scripts/dev/apply-wasi-runtime-bridge.py"
      - "scripts/dev/apply-wasi-runtime-launcher.py"
      - "scripts/gen/generate-wasi-runtime-bridge.py"
      - "scripts/check/gate-076*"
      - "scripts/check/gate-676*"
      - "scripts/check/gate-819*"
      - "scripts/check/gate-841*"
      - "tests/fixtures/host/**"
      - "tests/fixtures/wasi_p2_native/**"
      - "issues/open/076-*"
      - "issues/open/676-*"
      - "issues/open/819-*"
      - "issues/open/841-*"
      - "issues/done/076-*"
      - "issues/done/676-*"
      - "issues/done/819-*"
      - "issues/done/841-*"
      - ".github/workflows/wasi-runtime-abi-production.yml"
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  migrate-runtime-ownership:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/wasi-runtime-abi-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wasi-runtime-abi-production
          fetch-depth: 0
      - name: Apply mechanical runtime ABI migration
        run: |
          python3 scripts/dev/apply-wasi-runtime-abi-rename.py
          python3 scripts/dev/apply-wasi-runtime-bridge.py
          python3 scripts/dev/apply-wasi-runtime-launcher.py
      - name: Commit migration
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "runtime ABI migration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(runtime): wire P2 core through versioned runtime ABI"
          git push origin HEAD:agent/wasi-runtime-abi-production

  adapter-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Build real-WASI adapter and core bridge
        run: |
          cargo +stable build --manifest-path runtime/wasi-p2-adapter/Cargo.toml --target wasm32-wasip2 --release
          RUSTFLAGS="-C link-arg=--import-memory -C link-arg=-zstack-size=16384" \
            cargo +stable build --manifest-path runtime/wasi-p2-bridge/Cargo.toml --target wasm32-unknown-unknown --release
          if [[ -f src/compiler/wasm/component_p2_runtime_bridge_generated.ark ]]; then
            python3 scripts/gen/generate-wasi-runtime-bridge.py --check
          fi

  seed-runtime-artifacts:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/wasi-runtime-abi-production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wasi-runtime-abi-production
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Build checked runtime artifacts
        run: |
          cargo +stable build --manifest-path runtime/wasi-p2-adapter/Cargo.toml --target wasm32-wasip2 --release
          cp runtime/wasi-p2-adapter/target/wasm32-wasip2/release/arukellt_wasi_p2_adapter.wasm runtime/wasi-p2-adapter/runtime-adapter.wasm
          RUSTFLAGS="-C link-arg=--import-memory -C link-arg=-zstack-size=16384" \
            cargo +stable build --manifest-path runtime/wasi-p2-bridge/Cargo.toml --target wasm32-unknown-unknown --release
          python3 scripts/gen/generate-wasi-runtime-bridge.py
      - name: Commit checked artifacts
        run: |
          if [[ -z "$(git status --porcelain -- runtime/wasi-p2-adapter/runtime-adapter.wasm src/compiler/wasm/component_p2_runtime_bridge_generated.ark)" ]]; then
            echo "checked runtime artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/wasi-p2-adapter/runtime-adapter.wasm src/compiler/wasm/component_p2_runtime_bridge_generated.ark
          git commit -m "build(runtime): refresh WASI P2 runtime artifacts"
          git push origin HEAD:agent/wasi-runtime-abi-production

  close-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run WASI/runtime ABI close gates
        run: |
          set -euo pipefail
          for gate in \
            scripts/check/gate-076-wasi-p2-filesystem.py \
            scripts/check/gate-676-std-host-fs-env-process.py \
            scripts/check/gate-819-runtime-abi-core-op-lowering.py \
            scripts/check/gate-841-real-wasi-network-abi.py; do
            if [[ -f "$gate" ]]; then
              python3 "$gate"
            fi
          done

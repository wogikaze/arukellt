name: WASI runtime ABI production

on:
  pull_request:
    paths:
      - "src/compiler/wasm/**"
      - "std/host/**"
      - "data/core-ops.toml"
      - "runtime/wasi-p2-adapter/**"
      - "tools/host-linker/**"
      - "scripts/run/**"
      - "scripts/dev/apply-wasi-runtime-abi-rename.py"
      - "scripts/check/gate-076*"
      - "scripts/check/gate-676*"
      - "scripts/check/gate-819*"
      - "scripts/check/gate-841*"
      - "tests/fixtures/host/**"
      - "tests/fixtures/wasi_p2_native/**"
      - "issues/open/076-*"
      - "issues/open/676-*"
      - "issues/open/819-*"
      - "issues/open/841-*"
      - "issues/done/076-*"
      - "issues/done/676-*"
      - "issues/done/819-*"
      - "issues/done/841-*"
      - ".github/workflows/wasi-runtime-abi-production.yml"
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  migrate-runtime-ownership:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/wasi-runtime-abi-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wasi-runtime-abi-production
          fetch-depth: 0
      - name: Apply mechanical runtime ABI ownership migration
        run: python3 scripts/dev/apply-wasi-runtime-abi-rename.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "runtime ownership migration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(runtime): move host operations behind runtime ABI"
          git push origin HEAD:agent/wasi-runtime-abi-production

  adapter-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build real-WASI runtime adapter
        run: cargo +stable build --manifest-path runtime/wasi-p2-adapter/Cargo.toml --target wasm32-wasip2 --release

  close-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run WASI/runtime ABI close gates
        run: |
          set -euo pipefail
          for gate in \
            scripts/check/gate-076-wasi-p2-filesystem.py \
            scripts/check/gate-676-std-host-fs-env-process.py \
            scripts/check/gate-819-runtime-abi-core-op-lowering.py \
            scripts/check/gate-841-real-wasi-network-abi.py; do
            if [[ -f "$gate" ]]; then
              python3 "$gate"
            fi
          done

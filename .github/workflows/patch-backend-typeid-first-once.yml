name: Patch backend TypeId priority once

on:
  pull_request:
    branches: [agent/backend-name-lookup-audit]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/backend-typeid-first'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/backend-typeid-first
          fetch-depth: 0

      - name: Move explicit TypeId lookup before name reconstruction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/compiler/wasm/ctx_gc_layout_lookup.ark')
          text = path.read_text()
          function_start = text.index('fn SelfEmitCtx_wasm_ref_type_idx_for_local(')
          function_end = text.index('fn strip_module_double_colon(', function_start)
          function = text[function_start:function_end]

          name_start = function.index('    if len(local_type_name) > 0 {')
          mvt_start = function.index('    // Prefer MirLocal.value_type after type_name', name_start)
          suffix_start = function.index('    if is_payload_with_stray_variant {', mvt_start)

          name_block = function[name_start:mvt_start]
          mvt_block = function[mvt_start:suffix_start]
          mvt_block = mvt_block.replace(
              '    // Prefer MirLocal.value_type after type_name (#843). Call dests sync\n'
              '    // MonoInstance return MVT so spine hits without body-scan infer.\n',
              '    // The semantic TypeId carried by MirLocal is authoritative. Resolve it\n'
              '    // before consulting migration names so emission does not reconstruct\n'
              '    // layout identity from strings.\n',
              1,
          )

          reordered = function[:name_start] + mvt_block + name_block + function[suffix_start:]
          if reordered.index('let mvt = local_access::MirLocal_value_type(loc)') > reordered.index(
              'let type_name_gc = SelfEmitCtx_wasm_ref_type_idx_for_type_name'
          ):
              raise SystemExit('TypeId lookup was not moved before name lookup')

          path.write_text(text[:function_start] + reordered + text[function_end:])
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/wasm/ctx_gc_layout_lookup.ark
          git commit -m 'refactor(proof): prefer explicit TypeId before backend names'
          git push origin HEAD:agent/backend-typeid-first

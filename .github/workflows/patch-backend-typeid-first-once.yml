name: Patch backend TypeId priority once

on:
  pull_request:
    branches: [agent/backend-name-lookup-audit]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/backend-typeid-first'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/backend-typeid-first
          fetch-depth: 0

      - name: Move explicit TypeId lookup before name reconstruction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/compiler/wasm/ctx_gc_layout_lookup.ark')
          text = path.read_text()
          old = '''    if len(local_type_name) > 0 {
              let type_name_gc = SelfEmitCtx_wasm_ref_type_idx_for_type_name(ctx, clone(local_type_name))
              if type_name_gc >= 0 {
                  // Non-constructor locals must not adopt concrete enum-variant
                  // storage from a misleading type_name (payload field values).
                  if is_struct_new_dest || !SelfEmitCtx_wasm_type_is_enum_variant(ctx, type_name_gc) {
                      return type_name_gc
                  }
              }
              // Tuple / user structs may live in gc_struct_names without a TypeTable
              // layout entry. Match local declaration (emit_gc_local_named_type).
              let named_struct_gc = SelfEmitCtx_wasm_ref_type_idx_for_named_gc_struct(ctx, clone(local_type_name))
              if named_struct_gc >= 0 {
                  return named_struct_gc
              }
          }
          // Prefer MirLocal.value_type after type_name (#843). Call dests sync
          // MonoInstance return MVT so spine hits without body-scan infer.
          let mvt = local_access::MirLocal_value_type(loc)
          let mvt_gc = SelfEmitCtx_wasm_storage_ref_type_idx_for_mir_value_type(ctx, mvt)
          if mvt_gc >= 0 {
              if is_struct_new_dest || !SelfEmitCtx_wasm_type_is_enum_variant(ctx, mvt_gc) {
                  return mvt_gc
              }
          }
          '''
          new = '''    // The semantic TypeId carried by MirLocal is authoritative. Resolve it
          // before consulting migration names so production emission does not
          // reconstruct layout identity from strings.
          let mvt = local_access::MirLocal_value_type(loc)
          let mvt_gc = SelfEmitCtx_wasm_storage_ref_type_idx_for_mir_value_type(ctx, mvt)
          if mvt_gc >= 0 {
              if is_struct_new_dest || !SelfEmitCtx_wasm_type_is_enum_variant(ctx, mvt_gc) {
                  return mvt_gc
              }
          }
          if len(local_type_name) > 0 {
              let type_name_gc = SelfEmitCtx_wasm_ref_type_idx_for_type_name(ctx, clone(local_type_name))
              if type_name_gc >= 0 {
                  // Non-constructor locals must not adopt concrete enum-variant
                  // storage from a misleading type_name (payload field values).
                  if is_struct_new_dest || !SelfEmitCtx_wasm_type_is_enum_variant(ctx, type_name_gc) {
                      return type_name_gc
                  }
              }
              // Tuple / user structs may live in gc_struct_names without a TypeTable
              // layout entry. Match local declaration (emit_gc_local_named_type).
              let named_struct_gc = SelfEmitCtx_wasm_ref_type_idx_for_named_gc_struct(ctx, clone(local_type_name))
              if named_struct_gc >= 0 {
                  return named_struct_gc
              }
          }
          '''
          if old not in text:
              raise SystemExit('local lookup ordering block missing')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/wasm/ctx_gc_layout_lookup.ark
          git commit -m 'refactor(proof): prefer explicit TypeId before backend names'
          git push origin HEAD:agent/backend-typeid-first

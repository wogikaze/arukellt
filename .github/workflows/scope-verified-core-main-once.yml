name: Scope VerifiedCore main once

on:
  pull_request:
    branches: [agent/formal-verification-hard-gates]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/typed-verified-core-emitter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typed-verified-core-emitter
          fetch-depth: 0

      - name: Limit artifact to main module declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/compiler/driver/verified_core_render.ark')
          text = path.read_text()

          import_anchor = 'use corehir::raw_types\n'
          if import_anchor not in text:
              raise SystemExit('raw_types import missing')
          text = text.replace(
              import_anchor,
              'use corehir::raw_types\nuse corehir::raw_record\nuse corehir::raw_dto\n',
              1,
          )

          old = '''    let fn_count = len(fn_infos)
              let mut fi = 0
              while fi < fn_count {
                  if fi > 0 { out = concat(out, ",") }
                  let rendered = vc_render_function(fn_infos, typed_fns, table, exprs, fi)
                  if !rendered.ok {
                      return rendered
                  }
                  out = concat(out, rendered.output)
                  fi = fi + 1
              }
          '''
          new = '''    let fn_count = len(fn_infos)
              let modules = raw_record::raw_program_modules(program)
              if len(modules) == 0 {
                  return VerifiedCoreRenderResult_err("VerifiedCore missing module boundary")
              }
              let main_module = get_unchecked(modules, len(modules) - 1)
              let main_decl_start = raw_dto::CoreHirModuleInfo_decl_start(main_module)
              let main_decl_end = main_decl_start + raw_dto::CoreHirModuleInfo_decl_count(main_module)
              let mut first_function = true
              let mut fi = 0
              while fi < fn_count {
                  let decl_index = fn_info::fn_info_decl_index_at(fn_infos, fi, 0 - 1)
                  if decl_index >= main_decl_start && decl_index < main_decl_end {
                      if !first_function { out = concat(out, ",") }
                      let rendered = vc_render_function(fn_infos, typed_fns, table, exprs, fi)
                      if !rendered.ok {
                          return rendered
                      }
                      out = concat(out, rendered.output)
                      first_function = false
                  }
                  fi = fi + 1
              }
          '''
          if old not in text:
              raise SystemExit('function emission loop missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/driver/verified_core_render.ark
          git commit -m 'fix(proof): scope VerifiedCore artifact to main module'
          git push origin HEAD:agent/typed-verified-core-emitter

status = "verified"

[[rules]]
id = "closure_move_capture"
domain = "closure"
statement = "Move capture transfers the cell into the environment; rebinding the source local does not leak into the closure."
fixtures = ["closure_capture/move_local.ark", "closure_capture/move_rebind_cell.ark"]
diagnostics = ["diagnostics/closure_move_after_capture.ark"]
adrs = ["ADR-061"]

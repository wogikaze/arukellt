[[rules]]
id = "closure_borrow_capture"
domain = "closure"
statement = "Borrow capture shares the local cell; writes through one handle are observed by the other while the borrow is live."
fixtures = ["closure_capture/borrow_local.ark", "closure_capture/borrow_rebind_cell.ark"]
diagnostics = ["diagnostics/closure_borrow_conflict.ark"]
adrs = ["ADR-061"]

[[rules]]
id = "closure_escape_boundaries"
domain = "closure"
statement = "Escaping captures (storing/returning closures over cells) keep observable values; mutable-borrow rebind captures ride a promoted shared cell the env can carry, while remaining borrow captures are diagnostics."
fixtures = ["closure_capture/escape_store.ark", "closure_capture/escape_arg.ark", "closure_capture/escape_borrow_arg.ark", "closure_capture/escape_borrow_return.ark", "closure_capture/escape_borrow_store.ark"]
diagnostics = ["diagnostics/closure_borrow_return.ark", "diagnostics/closure_borrow_store.ark", "diagnostics/closure_borrow_callback.ark"]
adrs = ["ADR-061", "ADR-081"]
status = "verified"

[[rules]]
id = "match_exhaustiveness"
domain = "evaluation"
statement = "A match must be provably exhaustive: an unguarded catchall arm, full variant coverage of a finite domain, or an all-irrefutable tuple/struct arm; anything else is a compile-time diagnostic, so an unmatched match cannot reach backend-divergent runtime behavior."
fixtures = ["match_extensions/catchall_unmatched.ark", "match_extensions/or_arm_edge.ark", "match_extensions/match_guard.ark", "match_extensions/tuple_arm_match.ark", "enums/exhaustive_match.ark", "enums/option_tuple_payload.ark", "question_mark/user_error_type.ark"]
diagnostics = ["diagnostics/non_exhaustive.ark", "diagnostics/non_exhaustive_literal.ark", "diagnostics/non_exhaustive_payload.ark", "diagnostics/non_exhaustive_guard.ark"]
adrs = ["ADR-082"]
status = "verified"

[[rules]]
id = "closure_nested_capture_through"
domain = "closure"
statement = "A nested closure captures names from its whole lexical scope: intermediate frames forward the name as a transport slot without acquiring ownership, a descendant rebind rides the promoted shared cell end-to-end (writes reach the defining binding), and two mutable-borrow nested captures of one source conflict as E0214."
fixtures = ["closure_capture/nested_capture.ark", "closure_capture/nested_capture_escape.ark"]
diagnostics = ["diagnostics/closure_nested_borrow_conflict.ark"]
adrs = ["ADR-083"]
status = "verified"
[[rules]]
id = "match_or_pattern_alternatives"
domain = "evaluation"
statement = "An or-pattern arm compares each alternative against the scrutinee in turn — tag equality for variant alternatives, value equality for literals — and matches when any alternative hits; alternatives are discriminators only and may not bind variables or nest composite patterns, which are compile-time diagnostics."
fixtures = ["match_extensions/or_variant_alternatives.ark", "match_extensions/or_pattern.ark", "match_extensions/or_arm_edge.ark"]
diagnostics = ["diagnostics/or_pattern_binding.ark"]
adrs = ["ADR-082"]
status = "verified"

[[rules]]
id = "match_variant_payload_subpatterns"
domain = "evaluation"
statement = "A variant pattern matches only when its tag matches and every non-binding payload sub-pattern — literal, string, unit-variant name, tuple, or nested variant — compares equal against the extracted payload field; composite children still bind their inner identifiers, or-pattern alternatives carry their own payload conditions, and struct sub-patterns in payload position are a compile-time diagnostic rather than a silently skipped check."
fixtures = ["match_extensions/variant_payload_subpat.ark"]
diagnostics = ["diagnostics/variant_payload_struct_subpat.ark"]
adrs = ["ADR-082"]
status = "verified"

[[rules]]
id = "match_untyped_option_result_scrutinee"
domain = "evaluation"
statement = "A match on an Option/Result value produced by an inline payload constructor, an inferred let binding, or an Option-of-tuple annotation behaves identically on wasm32-gc and wasm32 linear: the constructor records the concrete payload spelling on the destination local so payload reads select the same variant slot the constructor picked, producing valid core Wasm and equal observable results. Untyped unit constructors and other weakly-spelled scrutinees remain a residual gap tracked by #906."
fixtures = ["match_extensions/untyped_option_scrutinee.ark"]
diagnostics = []
adrs = ["ADR-060", "ADR-082"]
status = "verified"


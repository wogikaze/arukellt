# Observable semantics registry — the single specification system for
# Arukellt's observable language rules (RFC-011 item 45 / issue #877).
#
# Each [[rules]] entry is one observable contract: what a source program
# must compute, reject, or print, independent of backend. Rules are
# anchored to fixtures that prove them on the fixture harness (both
# wasm32-gc and wasm32 linear via the cross-backend parity matrix,
# issue #875).
#
# Fields:
#   id          unique snake_case rule id
#   domain      one of: alias | copy | evaluation | numeric | unicode |
#               closure | trait   (RFC-011 item 45 domain list)
#   statement   the observable contract in one sentence
#   fixtures    run/check-only fixtures proving the rule (relative to
#               tests/fixtures/); MUST be registered in manifest.txt
#   diagnostics optional diag/compile-error fixtures proving rejections
#   adrs        ACCEPTED ADRs that norm the rule
#   status      verified | provisional | unimplemented
#   issue       tracking issue — REQUIRED unless status = "verified"
#
# Checked by scripts/check/check-observable-semantics.py; rendered into
# docs/language/observable-semantics.md by scripts/gen/generate-docs.py.

[[rules]]
id = "alias_move_after_use_value"
domain = "alias"
statement = "Moving a value into a let/call ends the source binding; using it afterwards is a compile-time error."
fixtures = ["ownership/copy_and_mutability.ark"]
diagnostics = ["diagnostics/ownership_move_after_use.ark"]
adrs = ["ADR-059"]
status = "verified"

[[rules]]
id = "alias_move_after_use_adt"
domain = "alias"
statement = "Enum/struct values follow the same move rule; using an ADT after move is a diagnostic, not a silent alias."
fixtures = ["ownership/adt_probe.ark"]
diagnostics = ["diagnostics/adt_move_after_use.ark"]
adrs = ["ADR-059", "ADR-060"]
status = "verified"


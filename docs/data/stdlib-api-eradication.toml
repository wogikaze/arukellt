# ADR-046 free-function eradication — classification source of truth.
#
# Every public stdlib free / monomorphic / prelude_wrapper symbol in
# std/manifest.toml resolves to exactly one class here. The same rules
# also classify top-level `pub fn` declarations under std/**/*.ark that
# have no manifest entry (~447 today); those are the unregistered public
# free functions that made the "0 public free functions" scorecard
# unmeasurable before issue #703. The generated scorecard and inventory
# live in docs/stdlib/eradication.md (scripts/gen/generate-docs.py);
# coverage is enforced by `python3 scripts/check/check-stdlib-eradication.py`
# and by `docs regenerate` / `docs check`, which fail on any unclassified
# manifest function, any unregistered source declaration that falls
# through to [source_default], and any manifest entry that claims a std
# declaration but has none.
#
# Class vocabulary (issue #709):
#   must delete          — removal work only: the method/associated
#                          replacement already exists or the
#                          functionality intentionally disappears
#                          (ADR-014 deprecation rules still apply).
#   associated-or-method — replacement must land as an inherent / trait
#                          / associated API before the free symbol can
#                          retire; the owner issue tracks delivery.
#   intrinsic-only       — stays a non-public `__intrinsic_*` or
#                          `kind = "intrinsic"` bridge; never
#                          user-reachable API. `kind = "intrinsic_wrapper"`
#                          is a public wrapper kind and is not accepted.
#
# Rule fields (all present fields must match; first match wins):
#   label       — human-readable rule name for errors/docs
#   name        — exact symbol name, or list of names
#   prefix      — symbol name starts-with (string or list)
#   kind        — manifest `kind` equals (string or list)
#   module      — manifest/source `module` equals (string or list)
#   module_pfx  — manifest/source `module` starts-with (string or list)
#   path        — std source path equals (string or list), e.g.
#                 "std/collections/hash_map.ark"
#   path_pfx    — std source path starts-with (string or list)
#   module_less — true when the entry has no `module` (prelude scope)
#   deprecated  — true when the entry is deprecated (deprecated_by set
#                 or stability = "deprecated")
#   source_only — rule matches only unregistered std declarations
#   manifest_only — rule matches only manifest `[[functions]]` entries
# `owner` is an issue id (open or done) or "none" for intrinsic-only.
# `replacement` is human-readable guidance for migration notes.
#
# Ownership split for #703 (single owner per family): #703 owns the
# monomorphic cutover families — "deprecated prelude wrappers" (4),
# "deprecated std::seq helpers" (13), and "monomorphic seq/combinator
# frees" (34), 51 symbols total. The 34 stable frees still need the
# ADR-014 deprecation window before deletion; #917 owns every other
# family as the execution umbrella.

[meta]
policy_adr = "ADR-046"
tracking_issue = "709"
execution_issue = "917"
zero_goal = "public free functions, prelude_wrapper entries, monomorphic helpers"

# -- Non-public intrinsics --

[[rules]]
label = "private intrinsics"
prefix = "__intrinsic_"
class = "intrinsic-only"
owner = "none"

# `memory_copy` / `memory_fill` are public `pub fn` wrappers in std::wasm,
# not private bridges. Classifying them as intrinsic-only was the loophole
# that let two user-reachable free functions escape the scorecard.
[[rules]]
label = "wasm memory intrinsic wrappers"
module = "std::wasm"
name = ["memory_copy", "memory_fill"]
class = "must delete"
owner = "917"
replacement = "keep only the non-public __intrinsic_memory_* bridge; no user-reachable replacement (experimental, ADR-014 D4)"

# -- Unregistered std declarations (source-only overrides) --
#
# These families exist only as `pub fn` under std/**/*.ark with no manifest
# entry. Rules are evaluated before the module-family defaults so each
# family gets an explicit replacement/owner instead of the generic text.

[[rules]]
label = "hash set monomorphic adapters"
source_only = true
prefix = "hashset_"
class = "associated-or-method"
owner = "917"
replacement = "HashSet methods once the HashSet type surface lands; see std::collections::hash"

[[rules]]
label = "hash_map monomorphic adapters"
source_only = true
module = "std::collections::hash_map"
class = "associated-or-method"
owner = "917"
replacement = "HashMap methods (new/insert/get/contains_key/remove/len/is_empty exist; keys/values/entries methods pending)"

[[rules]]
label = "hash_string monomorphic adapters"
source_only = true
module = "std::collections::hash_string"
class = "associated-or-method"
owner = "917"
replacement = "HashMap methods (same adapter family as std::collections::hash_map)"

[[rules]]
label = "hash_fn monomorphic adapters"
source_only = true
module = "std::collections::hash_fn"
class = "associated-or-method"
owner = "917"
replacement = "HashMap methods for fn-valued maps (same adapter family)"

[[rules]]
label = "hash_str_fn monomorphic adapters"
source_only = true
module = "std::collections::hash_str_fn"
class = "associated-or-method"
owner = "917"
replacement = "HashMap methods for fn-valued maps (same adapter family)"

[[rules]]
label = "collections sort free algorithms"
source_only = true
module = "std::collections::sort"
class = "associated-or-method"
owner = "697"
replacement = "Vec::sort / sort_by / sort_by_key methods (Vec<T> operation extension)"

# -- Prelude overrides (evaluated before the prelude default) --

[[rules]]
label = "deprecated prelude wrappers"
module_less = true
deprecated = true
class = "must delete"
owner = "703"
replacement = "manifest deprecated_by targets: byte_at, std::text::concat, std::host::stdio::{print,println}"

[[rules]]
name = "panic"
module_less = true
class = "associated-or-method"
owner = "917"
replacement = "associated on a core namespace type (e.g. Std::panic) or an explicit ADR exception"

[[rules]]
label = "vec intrinsic-compat frees"
module_less = true
name = ["push", "pop", "len", "get", "set", "get_unchecked", "clear", "as_slice", "slice_len", "slice_get"]
class = "must delete"
owner = "917"
replacement = "v.push(x) / v.len() / Vec methods (already emitted via impl Vec<T>)"

[[rules]]
label = "assertion frees"
module_less = true
name = ["assert_eq", "assert_ne", "assert_eq_i64", "assert_eq_str"]
class = "must delete"
owner = "917"
replacement = "std::test::assert_* module functions (no Test associated API exists; harness-surface design is still open)"

[[rules]]
label = "monomorphic seq/combinator frees"
module_less = true
prefix = ["sort_", "map_", "filter_", "fold_", "any_", "find_", "contains_", "reverse_", "remove_", "sum_", "product_", "map_option_", "map_result_"]
class = "must delete"
owner = "703"
replacement = "Iterator methods / generic std::seq equivalents"

[[rules]]
label = "monomorphic numeric conversions"
module_less = true
prefix = ["u8_to_i32", "u16_to_i32", "i8_to_i32", "i16_to_i32", "i32_to_u8", "i32_to_u16", "i32_to_i8", "i32_to_i16", "u32_to_u64", "u64_to_u32", "i32_to_i64", "i64_to_i32", "f32_to_f64", "f64_to_f32", "i32_to_u32", "f64_bits_lo", "f64_bits_hi"]
class = "must delete"
owner = "917"
replacement = "From/Into associated conversions"

[[rules]]
label = "monomorphic HashMap builtins"
module_less = true
prefix = "HashMap_"
class = "must delete"
owner = "917"
replacement = "impl HashMap<K,V> methods (new/insert/get/contains_key/remove/len/is_empty) already exist; retire after the ADR-014 deprecation window"

# -- Deprecated non-prelude symbols --

[[rules]]
label = "legacy linear deque frees"
module = "std::collections::linear"
prefix = "deque_"
class = "must delete"
owner = "710"
replacement = "Deque<T> methods (new/with_capacity/push_front/push_back/pop_front/pop_back/front/back/len/is_empty/clear); ADR-086 §8 keeps the Vec<i32> layout through the ADR-014 deprecation window"

[[rules]]
label = "legacy linked_list frees"
module = "std::collections::linked_list"
prefix = "linked_list_"
class = "must delete"
owner = "710"
replacement = "LinkedList<T> methods (new/push_front/push_back/pop_front/pop_back/front/back/len/is_empty/clear/iter); ADR-086 §8"

[[rules]]
label = "deprecated std::seq helpers"
module = "std::seq"
deprecated = true
class = "must delete"
owner = "703"
replacement = "Iterator adapters / Vec methods (#691)"

[[rules]]
label = "deprecated module frees"
deprecated = true
class = "must delete"
owner = "917"
replacement = "module-associated equivalents"

# -- Prelude default --

[[rules]]
label = "prelude frees (default)"
module_less = true
manifest_only = true
class = "associated-or-method"
owner = "917"
replacement = "method / associated equivalent on the receiver or namespace type"

# -- Module-scoped free functions -> methods / associated --

[[rules]]
label = "std::io and host stdio frees"
module = ["std::io", "std::host::stdio"]
class = "associated-or-method"
owner = "693"
replacement = "Read / Write / BufRead / Seek trait methods and Stdin/Stdout/Stderr associated"

[[rules]]
label = "std::test assert frees"
module = "std::test"
class = "associated-or-method"
owner = "917"
replacement = "std::test module functions; the Test associated API referenced by #719 was never implemented, so the harness-surface replacement is still open"

[[rules]]
label = "std::seq remaining"
module = "std::seq"
class = "associated-or-method"
owner = "917"
replacement = "Slice/Vec methods (sort_by, binary_search family)"

[[rules]]
label = "std::core::iter frees"
module = "std::core::iter"
class = "associated-or-method"
owner = "917"
replacement = "Iterator trait methods / adapter associated fns"

[[rules]]
label = "std::collections frees"
module_pfx = "std::collections"
class = "associated-or-method"
owner = "917"
replacement = "collection type methods (HashMap/HashSet/Deque/BTree/SortedMap/etc.)"

[[rules]]
label = "std::text frees"
module_pfx = "std::text"
class = "associated-or-method"
owner = "917"
replacement = "String/str methods, Builder methods, Rope methods"

[[rules]]
label = "std::json/toml/csv frees"
module_pfx = ["std::json", "std::toml", "std::csv"]
class = "associated-or-method"
owner = "917"
replacement = "Json/Toml/Csv value methods and associated parse/stringify"

[[rules]]
label = "std::bytes frees"
module = "std::bytes"
class = "associated-or-method"
owner = "917"
replacement = "Bytes/Buf/Cursor methods and associated encoders"

[[rules]]
label = "std::simd frees"
module_pfx = "std::simd"
class = "associated-or-method"
owner = "917"
replacement = "SIMD vector methods (add/sub/extract_lane/etc.)"

[[rules]]
label = "std::wasm builder frees"
module = "std::wasm"
class = "associated-or-method"
owner = "917"
replacement = "WasmBuilder/Module/Type associated functions and methods"

[[rules]]
label = "std::wit/component frees"
module_pfx = ["std::wit", "std::component"]
class = "associated-or-method"
owner = "917"
replacement = "Wit/Component/Handle associated functions and methods"

[[rules]]
label = "host/core namespace frees"
module_pfx = ["std::host", "std::fs", "std::env", "std::process", "std::random", "std::time", "std::signal", "std::cli", "std::core", "std::path"]
class = "associated-or-method"
owner = "917"
replacement = "Fs/Env/Process/Clock/Random/Cli/Path/Signal associated functions and methods"

# -- Catch-all for unregistered std declarations --
#
# A top-level `pub fn` under std/**/*.ark whose name has no manifest entry
# and matches no explicit rule lands here. This is an error class, not an
# accepted classification: add an explicit `source_only` rule (or register
# the symbol) so the real std surface stays measurable under ADR-046.
[source_default]
label = "unclassified std free declaration"
class = "unregistered"
owner = "917"
replacement = "add a source_only rule with a method/associated replacement and owner"

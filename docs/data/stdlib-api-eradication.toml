# ADR-046 free-function eradication — classification source of truth.
#
# Every public stdlib free / monomorphic / prelude_wrapper symbol in
# std/manifest.toml resolves to exactly one class here. The same rules
# also classify top-level `pub fn` declarations under std/**/*.ark that
# have no manifest entry (255 today); those are the unregistered public
# free functions that made the "0 public free functions" scorecard
# unmeasurable before issue #703. The generated scorecard and inventory
# live in docs/stdlib/eradication.md (scripts/gen/generate-docs.py);
# coverage is enforced by `python3 scripts/check/check-stdlib-eradication.py`
# and by `docs regenerate` / `docs check`, which fail on any unclassified
# manifest function, any unregistered source declaration that falls
# through to [source_default], and any manifest entry that claims a std
# declaration but has none.
#
# Class vocabulary (issue #709):
#   must delete          — removal work only: the method/associated
#                          replacement already exists or the
#                          functionality intentionally disappears
#                          (ADR-014 deprecation rules still apply).
#   associated-or-method — replacement must land as an inherent / trait
#                          / associated API before the free symbol can
#                          retire; the owner issue tracks delivery.
#   intrinsic-only       — stays a non-public `__intrinsic_*` or
#                          `kind = "intrinsic"` bridge; never
#                          user-reachable API. `kind = "intrinsic_wrapper"`
#                          is a public wrapper kind and is not accepted.
#
# Rule fields (all present fields must match; first match wins):
#   label       — human-readable rule name for errors/docs
#   name        — exact symbol name, or list of names
#   prefix      — symbol name starts-with (string or list)
#   kind        — manifest `kind` equals (string or list)
#   module      — manifest/source `module` equals (string or list)
#   module_pfx  — manifest/source `module` starts-with (string or list)
#   path        — std source path equals (string or list), e.g.
#                 "std/collections/hash_map.ark"
#   path_pfx    — std source path starts-with (string or list)
#   module_less — true when the entry has no `module` (prelude scope)
#   deprecated  — true when the entry is deprecated (deprecated_by set
#                 or stability = "deprecated")
#   source_only — rule matches only unregistered std declarations
#   manifest_only — rule matches only manifest `[[functions]]` entries
# `owner` is an issue id (open or done) or "none" for intrinsic-only.
# `replacement` is human-readable guidance for migration notes.
#
# Ownership split for #703 (single owner per family): #703 owns the
# monomorphic cutover families — "deprecated std::seq helpers" (13) and
# "monomorphic seq/combinator frees" (32). The 31 callable stable entries
# were deprecated (W0009 + migration guide + changelog) in the ADR-087 0.x
# wave and deleted in Wave 2 on 2026-10-27; their bare names now fail with
# E0100 hints. The provisional `filter_i32` remains the only member of that
# family (individual deferral), and the two stale, non-callable builtin
# entries (`map_option_String_String`, `map_result_i32_i32`) were retired in
# the earlier wave. #917 owns every other family as the execution umbrella.

[meta]
policy_adr = "ADR-046"
tracking_issue = "709"
execution_issue = "917"
zero_goal = "public free functions, prelude_wrapper entries, monomorphic helpers"

# -- Non-public intrinsics --

[[rules]]
label = "private intrinsics"
prefix = "__intrinsic_"
class = "intrinsic-only"
owner = "none"

# `memory_copy` / `memory_fill` were public `pub fn` wrappers in std::wasm.
# They were experimental, so ADR-014 D4 allowed the #917 wave to delete them
# directly; only the non-public `__intrinsic_memory_*` bridge remains.

# -- Unregistered std declarations (source-only overrides) --
#
# These families exist only as `pub fn` under std/**/*.ark with no manifest
# entry. Rules are evaluated before the module-family defaults so each
# family gets an explicit replacement/owner instead of the generic text.

# The 50 hash_map::hashmap_* adapters and the 29 hash_string / 11 hash_fn /
# 11 hash_str_fn implementation frees were retired by #917 on 2026-10-27.
# `impl HashMap<K,V>` methods are the only spelling; their MIR lowering
# targets are the now non-public implementation functions in hash_string /
# hash_fn / hash_str_fn, so no source declaration in those modules is public.
#
# The 21 `std::collections::hash` HashSet frees (`hashset_*` 15 and
# `hashset_str_*` 6) were deprecated with W0009 and deleted by #917 on
# 2026-10-29 (wave/hash-group). The declarations stay as non-public MIR
# lowering targets behind `HashSet<i32>` / `HashSet<String>`, so no `pub fn`
# remains for those names.
#
# The same module's 21 HashMap flat-store frees (`hashmap_*`) completed the
# identical ADR-087 two-phase lifecycle on 2026-10-29 (wave/hashmap-surface):
# Wave 1 landed the `HashMap<i32, i32>` capacity/bulk method surface and the
# W0009 table, and Wave 2 deleted the manifest entries and made the
# declarations non-public lowering targets. The unregistered
# `hashmap_entry_pairs` lowering target is non-public too, so the module has
# no remaining `pub fn`; the only public HashMap names are the type methods.

# -- Prelude overrides (evaluated before the prelude default) --
#
# The `collections sort free algorithms` source family and the `panic`
# prelude entry were retired by #917 on 2026-10-29. The no-argument sort
# surface is `Vec::sort` / `sort_unstable` / `is_sorted` / `select_nth` (Ord
# bounded impl), and panic is the associated `Std::panic` control operation.

[[rules]]
label = "vec intrinsic-compat frees"
module_less = true
name = ["push", "pop", "len", "get", "set", "get_unchecked", "clear", "as_slice", "slice_len", "slice_get"]
class = "must delete"
owner = "917"
replacement = "Vec<T> methods: v.push(x), v.pop(), v.len(), v.get(idx), v.set(idx, val), v.get_unchecked(idx), v.as_slice(start, end); Slice<T> methods: view.len(), view.get(idx). `clear` was a stale non-callable entry and was retired directly."

[[rules]]
label = "assertion frees"
module_less = true
name = ["assert_eq", "assert_ne", "assert_eq_i64", "assert_eq_str"]
class = "must delete"
owner = "917"
replacement = "std::test::assert_eq_i32(actual, expected), assert_ne_i32(actual, unexpected), assert_eq_i64(...), assert_eq_string(...); the deprecated prelude wrappers delegate to the same assertions"

[[rules]]
label = "monomorphic seq/combinator frees"
module_less = true
prefix = ["sort_", "map_", "filter_", "fold_", "any_", "find_", "contains_", "reverse_", "remove_", "sum_", "product_", "map_option_", "map_result_"]
class = "must delete"
owner = "703"
replacement = "Vec / iterator methods: v.sort_by(cmp), v.iter().map(f).collect(), v.iter().filter(f).collect(), v.iter().fold(init, f), v.iter().sum(), v.iter().any(f), v.iter().find(f), v.iter().contains(x), v.iter().rev().collect(), v.drain(idx, idx + 1); Option::map / Result::map via std::core::container"
# Wave 1 landed 2026-10-26 under ADR-087: the 31 callable stable entries carried
# stability = "deprecated", deprecated_by, deprecated_since, and remove_in, and
# the bare names had W0009 coverage. Wave 2 (2026-10-27) deleted those 31
# manifest entries and their `std/prelude.ark` declarations; bare calls now
# fail with E0100 hints from resolver::removed_names. `filter_i32` stays
# provisional (deferred) and is the only row this rule still matches. The
# i64/f64 numeric iterator lanes remain planned, so the replacement text
# describes the target shape plus the reachable loop / v.sort() fallback
# recorded in docs/stdlib/migration-guidance.md.

[[rules]]
label = "monomorphic numeric conversions"
module_less = true
prefix = ["u8_to_i32", "u16_to_i32", "i8_to_i32", "i16_to_i32", "i32_to_u8", "i32_to_u16", "i32_to_i8", "i32_to_i16", "u32_to_u64", "u64_to_u32", "i32_to_i64", "i64_to_i32", "f32_to_f64", "f64_to_f32", "i32_to_u32", "f64_bits_lo", "f64_bits_hi"]
class = "must delete"
owner = "917"
replacement = "canonical scalar conversion methods (ADR-067): u8/i8/u16/i16::to_i32, u32::to_u64, u64::to_u32_wrapping, i32::to_u8_wrapping/to_u16_wrapping/to_i8_wrapping/to_i16_wrapping/to_u32_bits, i32::into, i64::to_i32_checked, f32::to_f64, f64::to_f32, f64::to_bits_lo/to_bits_hi"

# The 20 monomorphic HashMap_* builtins (new/insert/get/contains_key/len for
# the four i32/String pairs) were retired by #917 on 2026-10-27. They were the
# compiler's own lowering targets, so the wave removed the resolver /
# typechecker / MIR / wasm / native-c registrations together with the i32->i32
# adapters; `impl HashMap<K,V>` methods are the only spelling now, and the
# retired names fail resolution with an E0100 removed-name hint.

# -- Deprecated non-prelude symbols --

[[rules]]
label = "legacy linear deque frees"
module = "std::collections::linear"
prefix = "deque_"
class = "must delete"
owner = "710"
replacement = "Deque<T> methods (new/with_capacity/push_front/push_back/pop_front/pop_back/front/back/len/is_empty/clear); ADR-086 §8 keeps the Vec<i32> layout through the ADR-014 deprecation window"

[[rules]]
label = "legacy linked_list frees"
module = "std::collections::linked_list"
prefix = "linked_list_"
class = "must delete"
owner = "710"
replacement = "LinkedList<T> methods (new/push_front/push_back/pop_front/pop_back/front/back/len/is_empty/clear/iter); ADR-086 §8"

[[rules]]
label = "deprecated std::seq helpers"
module = "std::seq"
deprecated = true
class = "must delete"
owner = "703"
replacement = "Iterator adapters / Vec methods (#691); the query wrappers delegate to the `Vec` receiver surface (`v.binary_search(target)`, `v.min()`, `v.max()`)"

# The 8 provisional generic std::seq algorithms (binary_search_by,
# binary_search_by_key, lower_bound, upper_bound, min_by, max_by, min_by_key,
# max_by_key) were retired by #917 on 2026-10-29 under ADR-014's provisional
# notice rule (changelog + migration guide, no W0009 or ADR-087 window). Their
# replacements are the `Vec<T: Ord>` receiver methods (binary_search /
# binary_search_by_key / lower_bound / upper_bound / min / max / min_by_key /
# max_by_key). The 13 deprecated i32 helpers remain on the rule above until
# their #703 Wave 2. `sort_by` stays `provisional`: the `v.sort()` replacement
# miscompiles `Vec<i64>` at 5+ elements on the linear and core-emit paths, so
# the allocation-free free stays until the method scratch layout is fixed
# (#965). It is matched by the `std::seq remaining` rule below.

# The std::text free surface was fully retired by #917 on 2026-10-27.
#   String methods: len_bytes, trim/trim_start/trim_end, replace, lines,
#     chars, pad_left_with/pad_right_with, repeat, len_chars, codepoint_at,
#     slice_bytes/try_slice_bytes, slice_chars/try_slice_chars, split,
#     concat, starts_with, ends_with, contains, to_lower, to_upper,
#     to_utf8_bytes, insert_text, delete_range, line_count
#   Associated: String::from_utf8_lossy, String::try_from_utf8
#   Vec<String>::join
#   DebugFormat::vec_i32 ... result_string_string
# The qualified removals carry E0100 hints from resolver::removed_names.

# The std::bytes free surface was fully retired by #917 in the ADR-087 Wave 2
# deletion on 2026-10-27 (wave/bytes-deletion). The 45 registered stable frees
# were deprecated with W0009 in the 2026-10-27 surface wave and deleted here;
# the eight unregistered helpers were already E0100 removals. Byte buffers are
# `Vec<i32>` methods, receiver-less constructors live on the `Bytes` namespace,
# and every qualified old call carries an E0100 hint from
# resolver::removed_names. No std::bytes free symbol remains, so this family
# has no live rule.

# The `deprecated module frees` rule (last match: `std::env::get_var`) was
# removed by the 2026-10-28 env wave after the last entry completed its
# ADR-087 Wave 2 deletion. A deprecated manifest function must now match its
# family rule explicitly.

# -- Prelude default --

[[rules]]
label = "prelude frees (default)"
module_less = true
manifest_only = true
class = "associated-or-method"
owner = "917"
replacement = "method / associated equivalent on the receiver or namespace type"

# -- Module-scoped free functions -> methods / associated --

[[rules]]
label = "std::io and host stdio frees"
module = ["std::io", "std::host::stdio"]
class = "associated-or-method"
owner = "693"
replacement = "Read / Write / BufRead / Seek trait methods and the typed std::io Stdout / Stderr Write handles. writer_write / writer_write_str were deleted with E0100 hints pointing at io::Stdout::new().write(...) / io::Stderr::new().write(...); the remaining free functions are the host-backed compatibility surface (stdin / stdout / stderr / read_stdin_line / print_bytes / print / println / eprintln), not the target API (#693)."

# The 18 std::test assertion / expectation helpers moved to the `Test`
# namespace in the 2026-10-29 surface wave. `Test::assert_eq_i32` and the other
# associated functions are the canonical spelling; the free declarations are
# the ADR-087 compatibility spelling until Wave 2 deletes them. `bench` is
# `experimental`, so it retires directly under ADR-014 D4 without a W0009
# window.
[[rules]]
label = "std::test assert frees"
module = "std::test"
class = "associated-or-method"
owner = "917"
replacement = "`std::test::Test` associated functions: Test::assert_true / assert_false / assert_eq_* / assert_ne_* / assert_eq_debug / assert_contains / assert_eq_snapshot / assert_msg, the expect_* helpers, and Test::bench; import `use std::test::Test`"

[[rules]]
label = "std::seq remaining"
module = "std::seq"
class = "associated-or-method"
owner = "917"
replacement = "Vec<T: Ord> methods (sort / binary_search / bounds / min / max / keyed variants); `sort_by` stays provisional because `v.sort()` miscompiles Vec<i64> at 5+ elements on the linear and core-emit paths (#965)"

# The 44 eager std::core::iter constructor / collector frees were retired by
# #917 on 2026-10-27. They were `provisional`, source-declared and manifest
# registered, so ADR-014's provisional notice rule applied (changelog +
# migration guide) and no ADR-087 stable window or W0009 entry was involved.
# The lazy `VecIter` / `Iterator` method surface is the only spelling now;
# qualified old calls get an E0100 hint from resolver::removed_names.

[[rules]]
label = "std::collections frees"
module_pfx = "std::collections"
class = "associated-or-method"
owner = "917"
replacement = "collection type methods (HashMap/HashSet/Deque/BTree/SortedMap/Arena/SlotMap/Interner/Bimap/Trie/etc.)"

# The json/toml/csv public free surface is fully retired by #917. The 2026-10-27
# waves moved the text/constructor helpers onto JsonText / TomlText / JsonValue /
# JsonField / Csv, and the final wave moved the document entry points onto
# `JsonValue::parse` / `TomlValue::parse` / `v.to_text()` and the parse-step
# helpers onto `JsonParseStep` / `TomlValStep` / `TomlKeyStep`. No rule is
# needed: the family has no remaining function entry or top-level `pub fn`.

[[rules]]
label = "host/core namespace frees"
module_pfx = ["std::host", "std::fs", "std::env", "std::process", "std::random", "std::time", "std::signal", "std::cli", "std::core", "std::path"]
class = "associated-or-method"
owner = "917"
replacement = "Fs / Env / Process / Clock / Random / Cli / Path / Signal associated functions and methods; the std::host::env frees are `Env::args` / `Env::var` / `Env::arg_count` / `Env::arg_at` / `Env::var_or_default` / `Env::has_flag` from `use std::host::env::Env`; the std::host::fs and legacy std::fs path frees are `Fs::read_to_string` / `read_bytes` / `write_string` / `write_bytes` / `is_readable_file` / `is_file` / `is_dir` / `read_dir` / `metadata` from `use std::host::fs::Fs`; the std::core range/order/error/hash frees retired behind `Range::new` / `r.contains(value)` / `r.len()` / `RangeInclusive::new` / `r.contains(value)` / `a.cmp(b)` / `e.message()` / `h1.combine_hash(h2)`; the sealed raw bridges are `RawArray` / `RawString` / `RawFloat` associated functions (stdlib-only)"
# Retired by #917 (2026-10-26) core-helper wave — unregistered declarations,
# so no manifest deprecation window was involved:
#   std::core::either (12 counted)   -> Either enum constructors + methods
#   std::core::math (6 counted; gcd  -> a.gcd(b) / a.lcm(b) / Integer trait
#     is name-collided with the
#     prelude wrapper and uncounted)
#   std::core::convert parse_* (3)   -> TryFrom<String> associated functions
#     (uncounted: the prelude parse_* entries already own those names)
# Retired by the #917 std::core receiver wave (2026-10-27, ADR-087 Wave 2):
#   range_new / range_contains / range_len / range_inclusive_new /
#   range_inclusive_contains / cmp_i32 / error_message / combine (8 manifest)
#   -> Range / RangeInclusive / i32 / Error receiver surface above; the
#   unregistered std::core::identity has no replacement.
# Retired by the #917 raw namespace wave (2026-10-27):
#   the 20 std::core::raw representation bridges -> RawArray / RawString /
#   RawFloat associated functions in the sealed stdlib module. The public
#   surface no longer exports a free spelling; copied bare names get E0100
#   hints that point at the public Vec / String / scalar replacements.
# Retired by the #917 std::host::fs `Fs` wave (2026-10-27, ADR-046 + ADR-087):
#   std::host::fs path frees (7 counted in this family) and std::fs
#   provisional frees (4) -> `Fs` namespace; the 5 stable wrappers moved to
#   the `deprecated module frees` rule with live W0009.
# Deleted by the ADR-087 Wave 2 change (2026-10-28, `wave/wave2-fs-clock`):
#   those 5 stable fs wrappers and the 2 stable std::host::clock frees, with
#   their manifest entries and declarations; qualified old calls now fail
#   with E0100 hints from resolver::removed_names.
#   The experimental fd_seek / fd_tell / fd_fdstat_errno frees remain
#   (wasm32-only; no wasm32-gc parity fixture).
# Deleted by the 2026-10-28 env wave: std::env::get_var (the last
#   `deprecated module frees` entry) and the duplicate std::host::env::get_var;
#   the replacement is `Env::var` from `use std::host::env::Env`.
# Retired by the second 2026-10-28 env wave (#917): the remaining
#   std::host::env free functions (args / var / arg_count / arg_at / has_flag,
#   plus the unregistered var_or_default) and the legacy std::env module path
#   (args / arg_count / arg_at / var / var_or_default). The surface is the
#   `Env` namespace only; qualified old calls fail with E0100 hints from
#   resolver::removed_names, and the module no longer needs a W0002 entry.
# The other families (cli, process, signal, random) are untouched.

# -- Catch-all for unregistered std declarations --
#
# A top-level `pub fn` under std/**/*.ark whose name has no manifest entry
# and matches no explicit rule lands here. This is an error class, not an
# accepted classification: add an explicit `source_only` rule (or register
# the symbol) so the real std surface stays measurable under ADR-046.
[source_default]
label = "unclassified std free declaration"
class = "unregistered"
owner = "917"
replacement = "add a source_only rule with a method/associated replacement and owner"

# Bootstrap contract SSOT (#770 Phase 2) — ADR-029

[trust]
base = "pinned_wasm"
artifact = "bootstrap/arukellt-selfhost.wasm"
provenance = "bootstrap/PROVENANCE.md"
entrypoint = "scripts/run/arukellt-selfhost.sh"
adr = "docs/adr/ADR-029-selfhost-native-verification-contract.md"
wasm_resolution_order = [
  "$ARUKELLT_SELFHOST_WASM",
  "bootstrap/arukellt-selfhost.wasm",
  ".build/selfhost/arukellt-s2-runtime.wasm",
  ".build/selfhost/arukellt-s3.wasm",
  ".build/selfhost/arukellt-s2.wasm",
  ".bootstrap-build/arukellt-s2.wasm",
  ".build/selfhost/arukellt-pinned-bootstrap.wasm",
]

[[stages]]
id = "0"
name = "trust_base"
description = "Pinned direct wasm32/wasi-p1 selfhost wasm is the trust base with 16384 memory32 pages (1 GiB)"
artifact = "bootstrap/arukellt-selfhost.wasm"
comparison = "n/a"

[[stages]]
id = "build_s2"
name = "current_selfhost"
description = "Pinned compiles src/compiler/main.ark → s2 under the 16384-page memory32 contract (stage-2 only; use for emitter refresh)"
artifact = ".build/selfhost/arukellt-s2.wasm"
command = "python3 scripts/manager.py selfhost build-compiler"
comparison = "build succeeds"

[[stages]]
id = "fixpoint"
name = "s2_equals_s3"
description = "sha256(s2) == sha256(s3) (ADR-029 gate; not for routine s2 refresh)"
artifact = ".build/selfhost/arukellt-s3.wasm"
command = "python3 scripts/manager.py selfhost fixpoint"
comparison = "sha256"

[[gates]]
id = "fixpoint"
command = "python3 scripts/manager.py selfhost fixpoint"
ci_job = "selfhost"

[[gates]]
id = "fixture_parity"
command = "python3 scripts/manager.py selfhost fixture-parity"
ci_job = "selfhost"

[[gates]]
id = "cli_parity"
command = "python3 scripts/manager.py selfhost parity --mode --cli"
ci_job = "selfhost"

[[gates]]
id = "diag_parity"
command = "python3 scripts/manager.py selfhost diag-parity"
ci_job = "selfhost"

[[retired]]
id = "ARUKELLT_USE_RUST"
path = "env:ARUKELLT_USE_RUST"
reason = "Hard-fails in arukellt-selfhost.sh (#583 / ADR-029)"
archive = "docs/history/reports/bootstrap-rust-era-compiler-guide.md"

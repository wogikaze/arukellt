deny_intended_enforcement = "compile_time_mir"
deny_transitive = true
deny_applies_to = "run"
verified_on = ["wasm32", "wasm32-gc"]
notes = "Module runs. Intended deny: compile-time MIR on run (#291). Selfhost CLI has no --deny-clock; fixtures in DIAG_PARITY_SKIP (#459)."


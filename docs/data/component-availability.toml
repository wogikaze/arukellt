# Component availability axes (#770 Phase 2) — do not flatten to available=true/false

[meta]
target = "wasm32-gc"
public_contract = "ADR-054 component/wit core output with official WASI P2 packaging"
implementation_note = "The selfhost compiler emits the standard WASI P2 core ABI and the launcher uses the official wasm-tools component pipeline. Repository-specific bridges, post-linkers, and legacy compatibility paths are not supported."

[artifacts]
pinned_bootstrap = "bootstrap/arukellt-selfhost.wasm"
recommended_library_compiler = ".build/selfhost/arukellt-s2.wasm"
env_override = "ARUKELLT_SELFHOST_WASM"

[[surfaces]]
id = "command_component"
label = "Command component (wasi:cli/run)"
status = "available_on_pinned"
active_compiler = "pinned_or_s2"
external_tool_dependency = "required (wasm-tools component embed/new)"
notes = "The compiler emits standard P2 core imports; the launcher packages them with the official WASI CLI WIT world. gate-510 validation + gate-714 direct Wasmtime execution cover the command path."

[[surfaces]]
id = "library_component"
label = "Library component (pub fn exports)"
status = "requires_s2"
active_compiler = "s2_or_ARUKELLT_SELFHOST_WASM"
external_tool_dependency = "required (wasm-tools component embed/new)"
notes = "Library-style pub fn exports use the compiler's WIT output and official component tooling; no Rust bindings or repository-specific adapter is required."

[[surfaces]]
id = "wit_emit"
label = "WIT emit"
status = "partial"
active_compiler = "s2_preferred"
external_tool_dependency = "optional"
notes = "Scalar library WIT is emitted by the selfhost compiler; the official component toolchain consumes it for packaging."

[[surfaces]]
id = "jco_transpile"
label = "jco transpile + Node.js execution"
status = "smoke"
active_compiler = "s2_or_ARUKELLT_SELFHOST_WASM"
external_tool_dependency = "jco >= 1.25.2; Node.js >= 18"
notes = "Scalar pub fn exports execute via jco-generated JS glue. Node 23.6 requires --experimental-wasm-memory64 due to T3 i64 memory. String/record/variant canonical ABI adapters still pending (#029 area)."

[[surfaces]]
id = "component_cli"
label = "arukellt component build"
status = "provisional"
active_compiler = "same_as_compile"
external_tool_dependency = "required (wasm-tools for packaging/inspect/validate)"
notes = "Aliases compile --emit component and use official wasm-tools for packaging; inspect/validate remain delegated to wasm-tools."
